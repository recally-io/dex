version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/db/queries"
    schema: "internal/db/migrations"
    gen:
      go:
        package: "sqlc"
        out: "internal/db/sqlc"
        emit_json_tags: true
        emit_empty_slices: true
  # A plugin owns its queries. The core migrations stay the only schema source.
  - engine: "sqlite"
    queries: "plugins/github/queries"
    schema: "internal/db/migrations"
    gen:
      go:
        package: "store"
        out: "plugins/github/store"
        emit_json_tags: true
        emit_empty_slices: true
        omit_unused_structs: true
