version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/db/queries"
    schema: "internal/db/migrations"
    gen:
      go:
        package: "sqlc"
        out: "internal/db/sqlc"
        emit_json_tags: true
        emit_empty_slices: true
  # A plugin owns its queries and migrations. It can refer to core tables, so its schema also
  # reads the core migrations. The core schema never reads plugin migrations.
  - engine: "sqlite"
    queries: "plugins/github/queries"
    schema: ["internal/db/migrations", "plugins/github/migrations"]
    gen:
      go:
        package: "store"
        out: "plugins/github/store"
        emit_json_tags: true
        emit_empty_slices: true
        omit_unused_structs: true
  - engine: "sqlite"
    queries: "plugins/webhook/queries"
    schema: ["internal/db/migrations", "plugins/webhook/migrations"]
    gen:
      go:
        package: "store"
        out: "plugins/webhook/store"
        emit_json_tags: true
        emit_empty_slices: true
        omit_unused_structs: true
  - engine: "sqlite"
    queries: "plugins/email/queries"
    schema: ["internal/db/migrations", "plugins/email/migrations"]
    gen:
      go:
        package: "store"
        out: "plugins/email/store"
        emit_json_tags: true
        emit_empty_slices: true
        omit_unused_structs: true
