name: ZoomQA
options:
  bundleIdPrefix: dev.vaayne.dex.webviewpoc.qa
  deploymentTarget:
    iOS: "26.0"
targets:
  FocusZoom:
    type: bundle.ui-testing
    platform: iOS
    sources: [FocusZoom.swift]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "5.0"
      CODE_SIGNING_ALLOWED: NO
schemes:
  FocusZoom:
    build:
      targets:
        FocusZoom: [test]
    test:
      targets: [FocusZoom]
