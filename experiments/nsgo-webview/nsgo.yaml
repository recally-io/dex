name: Dex WebView POC
id: dev.vaayne.dex.webviewpoc
version: 0.1.0
build:
  targets: [windows_x64, android_arm64, macos_arm64, ios_simulator]
apple:
  info:
    NSAppTransportSecurity:
      NSAllowsLocalNetworking: true
      NSExceptionDomains:
        "127.0.0.1":
          NSExceptionAllowsInsecureHTTPLoads: true
android:
  loopback_cleartext: true
