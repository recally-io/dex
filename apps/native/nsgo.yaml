name: Dex
id: io.recally.dex
version: 0.1.0
url_schemes: [dex-workspace]

icon:
  png: ../assets/dex.png

dev:
  target: native

build:
  targets: [macos, ios, android_arm64]

licenses:
  allow:
    - github.com/recally-io/dex # First-party code.
    - modernc.org/memory # NSGo does not classify LICENSE-LOGO.
    - modernc.org/sqlite # NSGo does not classify the SQLite public-domain notice.

android:
  classes: [.nsgo/android/WorkspaceView.jar]

i18n:
  source: en

apple:
  info:
    LSMinimumSystemVersion: "14.0"
    MinimumOSVersion: "17.0"
    NSLocalNetworkUsageDescription: Connects to the Dex server you select.
    NSAppTransportSecurity: {}
    NSAppTransportSecurity-macos:
      NSExceptionDomains:
        "127.0.0.1":
          NSExceptionAllowsInsecureHTTPLoads: true
