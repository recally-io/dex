[tools]
go = "1.27.2"
golangci-lint = "2.14.0"
bun = "1.4.3"
# Development only: the vp (Vite+) launcher runs on Node. dex itself needs no Node.
node = "26.11.1"
dprint = "0.63.0"
prek = "0.5.5"
"aqua:sqlc-dev/sqlc" = "1.31.1"
"aqua:pressly/goose" = "3.29.0"
"npm:@markdown-viewer/documd" = "5.3.2"
goreleaser = "2.18.3"

[tasks.install]
description = "Install project dependencies from the lockfiles"
depends = ["install:web"]
run = "go mod download"

[tasks.format]
description = "Format all files"
run = ["dprint fmt", "golangci-lint fmt", "cd web && bunx --no-install vp fmt"]

# .github/workflows/check.yml runs these steps in parallel jobs; keep both lists equal.
[tasks.check]
description = "Check formatting, lint, types, tests, and builds"
run = [
  "prek validate-config prek.toml",
  "dprint check",
  "mise run check:testpolicy",
  "mise run check:db-drift",
  "mise run check:api-drift",
  "mise run check:web",
  "mise run check:go",
  "mise run check:native",
]

[tasks.build]
description = "Build bin/dex with the native agent runtime and web UI"
depends = ["build:web"]
run = "go build -o bin/dex ./cmd/dex"

[tasks."hooks:install"]
description = "Install the prek-managed pre-commit hook"
run = "prek install"

[tasks."build:web"]
description = "Build the embedded web UI"
dir = "web"
run = "bunx --no-install vp build"

[tasks."generate:api-web"]
description = "Generate the web API client from OpenAPI"
dir = "web"
run = "bunx --no-install openapi-ts"

[tasks."dev:web"]
description = "Start the web UI with the local API proxy"
dir = "web"
run = "bunx --no-install vp dev"
