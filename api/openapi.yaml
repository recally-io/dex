openapi: 3.0.3
info:
  title: dex
  version: 0.1.0
  description: >
    The HTTP API of dex control. The web UI and local CLI use it. On a loopback
    host without DEX_TOKEN the API has no authentication. Otherwise every
    operation except POST /api/session needs the access token, as a Bearer
    token or as the session cookie. The API refuses cross-site writes.
    Times are Unix milliseconds.
security:
  - bearer: []
  - session: []
paths:
  /api/session:
    post:
      operationId: createSession
      description: Exchanges the access token for the session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewSession" }
      responses:
        "204":
          description: The token is correct. The cookie holds it.
          headers:
            Set-Cookie:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: dex is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/maintenance:
    post:
      operationId: acquireMaintenance
      description: Hold worker admission for two minutes if no work is active. POST renews it.
      responses:
        "200":
          description: Worker admission is held until expiry or release.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: releaseMaintenance
      responses:
        "200":
          description: Worker admission can resume.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/chats:
    get:
      operationId: listChats
      description: All chats of the default agent, newest activity first.
      responses:
        "200":
          description: The chats.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createChat
      description: >
        Creates a web chat and sends its first message. The title is the start
        of the message, or the name of its first attachment. The settings of
        the new chat override the agent's. Returns when the message is stored;
        the answer comes through the chat's event stream.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewChat" }
      responses:
        "202":
          description: The chat exists and the message is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedChat" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/chats/{chatId}:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    get:
      operationId: getChat
      responses:
        "200":
          description: The chat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/chats/{chatId}/settings:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    put:
      operationId: setChatSettings
      description: >
        Sets the model and the thinking level of one chat. An absent field
        follows the agent's setting. They apply from the next message. 403 for
        a Telegram chat.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatSettings" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/chats/{chatId}/messages:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    post:
      operationId: sendMessage
      description: >
        Stores a message in a web chat and returns. A message with an ID that
        exists already is not stored again. The answer comes through the
        event stream. 409 when the agent has no model; 403 for a Telegram chat.
        Web and automation chats take messages.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "202":
          description: The message is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentMessage" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/chats/{chatId}/abort:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    post:
      operationId: abortChat
      description: >
        Withdraws queued input and results, then requests cancellation of the
        main turn and background execution of this chat. Earlier actions are
        not undone. Processes and remote work may continue.
        External channel chats are read-only on the web.
      responses:
        "200":
          description: Pending input is withdrawn and cancellation is requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/chats/{chatId}/events:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    get:
      operationId: watchChat
      description: >
        Server-sent events. Each event has `event: <type>` and one `data:` line
        with a ChatEvent as JSON. The first event is a snapshot; a later
        snapshot replaces all state. A comment line comes every 15 s. The
        server closes the stream when the worker restarts or when the client
        is too slow; the client reconnects and gets a new snapshot.
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/ChatEvent" }
        "404": { $ref: "#/components/responses/Error" }

  /api/uploads:
    post:
      operationId: createUpload
      description: >
        Stores one file for a later message, in the agent workspace at
        `uploads/<id>/<name>`. The agent reads it with its tools. The largest
        file is 20 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/uploads/{uploadId}:
    parameters:
      - name: uploadId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getUpload
      description: >
        The file of an upload. PNG, JPEG, GIF and WebP images come inline with
        their type; all other files come as a download of type
        application/octet-stream.
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/extensions:
    get:
      operationId: getExtensions
      description: >
        The agent's skills and MCP servers, from ~/.agents/ and the agent
        directory. It does not start MCP servers: before the agent starts, the
        servers are idle.
      responses:
        "200":
          description: The extensions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Extensions" }
        default: { $ref: "#/components/responses/Error" }

  /api/extensions/reload:
    post:
      operationId: reloadExtensions
      description: >
        Restarts the worker, which connects the MCP servers again. Skills
        need no reload. 409 when the agent has unfinished work. 400 when a
        file is not valid; the agent then keeps its MCP servers.
      responses:
        "200":
          description: The loaded extensions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Extensions" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: All settings, without secrets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        default: { $ref: "#/components/responses/Error" }

  /api/models:
    get:
      operationId: listModels
      description: The models of the providers that have credentials.
      responses:
        "200":
          description: The models.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings/agent:
    put:
      operationId: setAgent
      description: >
        Changes the default model, thinking level and instructions. Each chat
        uses them from its next message, except the settings that the chat
        overrides. An empty modelId clears the model.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Agent" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings/providers/{providerId}:
    parameters:
      - name: providerId
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: setProvider
      description: >
        Adds or changes a provider. An empty apiKey keeps the saved key. When
        the model list of a custom provider fails, the provider is saved and
        the response has the reason in `error`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProvider
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings/telegram/pairing:
    post:
      operationId: createTelegramPairing
      description: Creates a single-use owner pairing link. The link expires in 10 minutes.
      responses:
        "200":
          description: Pairing link
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string }
                  expiresAt: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/settings/wechat/login:
    post:
      operationId: beginWechatLogin
      description: Starts QR login. The person who confirms becomes the only allowed sender.
      responses:
        "200":
          description: QR login state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WechatLogin" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings/wechat/login/{loginId}/poll:
    post:
      operationId: pollWechatLogin
      description: Polls for up to 35 seconds. Saves credentials only after confirmed login.
      parameters:
        - in: path
          name: loginId
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                verifyCode: { type: string, pattern: "^[0-9]{1,16}$" }
      responses:
        "200":
          description: Current login state, with a new QR code when refreshed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WechatLogin" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings/wechat:
    delete:
      operationId: deleteWechat
      description: Stops WeChat and forgets its credentials. Past chats stay read-only.
      responses:
        "200":
          description: WeChat is off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings/telegram:
    put:
      operationId: setTelegram
      description: Saves the bot and restarts it. An empty token keeps the saved token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTelegram
      description: Turns Telegram off and forgets the token.
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings/feishu:
    get:
      operationId: getFeishu
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feishu" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setFeishu
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeishuInput" }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeishuSetup" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteFeishu
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings/feishu/registration:
    post:
      operationId: beginFeishu
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeishuBrand" }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeishuSetup" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings/feishu/registration/poll:
    post:
      operationId: pollFeishu
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeishuPoll" }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeishuSetup" }
        default: { $ref: "#/components/responses/Error" }

  /api/automations:
    get:
      operationId: listAutomations
      description: All automations of the default agent, oldest first.
      responses:
        "200":
          description: The automations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAutomation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/automations/preview:
    post:
      operationId: previewSchedule
      description: The next times of a schedule, as the scheduler computes them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "200":
          description: The next times.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchedulePreview" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/automations/{automationId}:
    parameters:
      - $ref: "#/components/parameters/AutomationId"
    get:
      operationId: getAutomation
      responses:
        "200":
          description: The automation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateAutomation
      description: >
        Changes the automation. The next run is computed again from now, so a
        change never runs a past time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAutomation
      description: Removes the automation and its run history. Its chats stay.
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        default: { $ref: "#/components/responses/Error" }

  /api/automations/{automationId}/run:
    parameters:
      - $ref: "#/components/parameters/AutomationId"
    post:
      operationId: runAutomation
      description: >
        Runs the automation now, outside its schedule. The run is skipped when
        the agent has no model or the previous run is still busy.
      responses:
        "202":
          description: The run, started or skipped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationRun" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/automations/{automationId}/runs:
    parameters:
      - $ref: "#/components/parameters/AutomationId"
    get:
      operationId: listAutomationRuns
      description: The last 50 runs, newest first.
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationRunList" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    AutomationId:
      name: automationId
      in: path
      required: true
      schema: { type: string }
    ChatId:
      name: chatId
      in: path
      required: true
      schema: { type: integer, format: int64 }

  securitySchemes:
    bearer: { type: http, scheme: bearer }
    session: { type: apiKey, in: cookie, name: dex_session }

  responses:
    Error:
      description: The request failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: A message for the user. }

    NewSession:
      type: object
      required: [token]
      properties:
        token: {
          type: string,
          description: The access token. `dex token` prints the stored token.,
        }

    Ok:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }

    Health:
      type: object
      required: [status, version, dataDir, workerReady]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
        dataDir: { type: string }
        workerReady: { type: boolean }

    Chat:
      type: object
      required: [id, channel, title, createdAt, updatedAt, busy, settings]
      properties:
        id: { type: integer, format: int64 }
        channel:
          type: string
          enum: [web, telegram, wechat, feishu, automation]
          description: External channel chats are read-only in the web UI.
        automationId:
          type: string
          description: The automation that created the chat.
        title: { type: string }
        createdAt: { type: integer, format: int64 }
        updatedAt:
          type: integer
          format: int64
          description: Time of the last message.
        busy:
          type: boolean
          description: True while a message of the chat has no answer yet.
        settings: { $ref: "#/components/schemas/ChatSettings" }

    ChatSettings:
      x-go-type: chat.Settings
      x-go-type-import:
        path: github.com/recally-io/dex/internal/chat
      type: object
      description: >
        The settings that a chat overrides. An absent field follows the
        agent's setting. provider and modelId are both present or both absent.
      properties:
        provider: { type: string }
        modelId: { type: string }
        thinkingLevel: { $ref: "#/components/schemas/ThinkingLevel" }

    ChatList:
      type: object
      required: [chats]
      properties:
        chats:
          type: array
          items: { $ref: "#/components/schemas/Chat" }

    MessageInput:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
          description: A new UUID from the client. A retried request uses the same ID.
        text:
          type: string
          maxLength: 32000
          description: >
            1 to 32000 characters. It can be empty when the message has an
            attachment.
        attachments:
          type: array
          maxItems: 10
          description: Upload IDs from POST /api/uploads, at most 10.
          items: { type: string }

    NewChat:
      allOf:
        - $ref: "#/components/schemas/MessageInput"
        - type: object
          properties:
            settings: { $ref: "#/components/schemas/ChatSettings" }

    Attachment:
      x-go-type: worker.Attachment
      x-go-type-import:
        path: github.com/recally-io/dex/internal/worker
      type: object
      required: [id, name, size, mimeType, path]
      properties:
        id: { type: string }
        name: { type: string }
        size: { type: integer, format: int64, description: Bytes. }
        mimeType: { type: string }
        path:
          type: string
          description: The path in the agent workspace, uploads/<id>/<name>.

    CreatedChat:
      type: object
      required: [chat, submissionId]
      properties:
        chat: { $ref: "#/components/schemas/Chat" }
        submissionId: { type: string }

    SentMessage:
      type: object
      required: [submissionId]
      properties:
        submissionId: { type: string }

    # Automations

    Schedule:
      x-go-type: automation.Schedule
      x-go-type-import:
        path: github.com/recally-io/dex/internal/automation
      type: object
      required: [kind]
      description: >
        every: each `minutes` minutes. daily: each day at `time`. weekly: at
        `time` on `days`. once: at `at`. Times are in the automation's time
        zone.
      properties:
        kind: { type: string, enum: [every, daily, weekly, once] }
        minutes: { type: integer, minimum: 5, maximum: 10080 }
        time: { type: string, description: "HH:MM, 24 h", example: "09:00" }
        days:
          type: array
          description: ISO weekdays, 1 is Monday.
          items: { type: integer, minimum: 1, maximum: 7 }
        at: { type: integer, format: int64 }

    ScheduleInput:
      type: object
      required: [schedule, timeZone]
      properties:
        schedule: { $ref: "#/components/schemas/Schedule" }
        timeZone: {
          type: string,
          description: An IANA time zone,
          such as Asia/Shanghai.,
        }

    SchedulePreview:
      type: object
      required: [nextRuns]
      properties:
        nextRuns:
          type: array
          description: At most 3 times; empty when the schedule has no future time.
          items: { type: integer, format: int64 }

    AutomationInput:
      x-go-type: automation.Input
      x-go-type-import:
        path: github.com/recally-io/dex/internal/automation
      type: object
      required: [name, prompt, schedule, timeZone, session, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        prompt: { type: string, minLength: 1, maxLength: 32000 }
        schedule: { $ref: "#/components/schemas/Schedule" }
        timeZone: { type: string }
        session:
          type: string
          enum: [new, reuse]
          description: >
            new: each run starts a new chat. reuse: all runs use one chat; a
            run is skipped while that chat is busy.
        enabled: { type: boolean }

    Automation:
      x-go-type: automation.Automation
      x-go-type-import:
        path: github.com/recally-io/dex/internal/automation
      allOf:
        - $ref: "#/components/schemas/AutomationInput"
        - type: object
          required: [id, nextRuns, createdAt, updatedAt]
          properties:
            id: { type: string }
            nextRuns:
              type: array
              description: At most 3 times; empty when disabled or done.
              items: { type: integer, format: int64 }
            lastRun: { $ref: "#/components/schemas/AutomationRun" }
            createdAt: { type: integer, format: int64 }
            updatedAt: { type: integer, format: int64 }

    AutomationList:
      type: object
      required: [automations]
      properties:
        automations:
          type: array
          items: { $ref: "#/components/schemas/Automation" }

    AutomationRun:
      x-go-type: automation.Run
      x-go-type-import:
        path: github.com/recally-io/dex/internal/automation
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: string }
        dueAt:
          type: integer
          format: int64
          description: The scheduled time; absent for a run that the user started.
        createdAt: { type: integer, format: int64 }
        status: { type: string, enum: [running, done, failed, skipped] }
        reason: { type: string }
        chatId: { type: integer, format: int64 }

    AutomationRunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/AutomationRun" }

    # Transcript

    Item:
      oneOf:
        - $ref: "#/components/schemas/UserItem"
        - $ref: "#/components/schemas/ThinkingItem"
        - $ref: "#/components/schemas/ToolItem"
        - $ref: "#/components/schemas/AssistantItem"
        - $ref: "#/components/schemas/ErrorItem"
      discriminator:
        propertyName: kind
        mapping:
          user: "#/components/schemas/UserItem"
          thinking: "#/components/schemas/ThinkingItem"
          tool: "#/components/schemas/ToolItem"
          assistant: "#/components/schemas/AssistantItem"
          error: "#/components/schemas/ErrorItem"

    UserItem:
      type: object
      required: [kind, id, text]
      properties:
        kind: { type: string, enum: [user] }
        id: { type: string }
        text: { type: string }
        at: { type: integer, format: int64 }
        queued:
          type: boolean
          description: True while the message waits for the agent.
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }

    ThinkingItem:
      type: object
      required: [kind, id, text]
      properties:
        kind: { type: string, enum: [thinking] }
        id: { type: string }
        text:
          type: string
          description: Empty when the provider redacted it.

    ToolItem:
      type: object
      required: [kind, id, name, args, output, status]
      properties:
        kind: { type: string, enum: [tool] }
        id: { type: string, description: The tool call ID. }
        name: { type: string }
        args:
          type: object
          additionalProperties: true
        output: { type: string }
        status:
          type: string
          enum: [running, done, error]
          description: A call that ended without a result is an error.
        durationMs: { type: integer, format: int64 }

    AssistantItem:
      type: object
      required: [kind, id, text]
      properties:
        kind: { type: string, enum: [assistant] }
        id: { type: string }
        text: { type: string, description: Markdown. }
        model: { type: string, description: "<provider>/<model id>" }
        usage: { $ref: "#/components/schemas/Usage" }

    ErrorItem:
      type: object
      required: [kind, id, reason]
      properties:
        kind: { type: string, enum: [error] }
        id: { type: string }
        reason: { type: string }
        aborted:
          type: boolean
          description: True when the user stopped the run.

    Usage:
      type: object
      required: [input, output]
      properties:
        input: { type: integer }
        output: { type: integer }

    Retry:
      type: object
      required: [attempt, at, reason]
      properties:
        attempt: { type: integer }
        at:
          type: integer
          format: int64
          description: Time of the next attempt.
        reason: { type: string }

    # Events

    ChatEvent:
      oneOf:
        - $ref: "#/components/schemas/SnapshotEvent"
        - $ref: "#/components/schemas/ItemEvent"
        - $ref: "#/components/schemas/AppendEvent"
        - $ref: "#/components/schemas/RunEvent"
      discriminator:
        propertyName: type
        mapping:
          snapshot: "#/components/schemas/SnapshotEvent"
          item: "#/components/schemas/ItemEvent"
          append: "#/components/schemas/AppendEvent"
          run: "#/components/schemas/RunEvent"

    SnapshotEvent:
      type: object
      required: [type, items, running]
      properties:
        type: { type: string, enum: [snapshot] }
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        running: { type: boolean }
        retry: { $ref: "#/components/schemas/Retry" }

    ItemEvent:
      type: object
      required: [type, item]
      description: Adds the item, or replaces the item with the same ID.
      properties:
        type: { type: string, enum: [item] }
        item: { $ref: "#/components/schemas/Item" }

    AppendEvent:
      type: object
      required: [type, id, text]
      description: Appends text to the text of the item with this ID.
      properties:
        type: { type: string, enum: [append] }
        id: { type: string }
        text: { type: string }

    RunEvent:
      type: object
      required: [type, running]
      properties:
        type: { type: string, enum: [run] }
        running: { type: boolean }
        retry: { $ref: "#/components/schemas/Retry" }

    # Settings

    Settings:
      type: object
      required: [agent, providers, builtins, apis, telegram, wechat]
      properties:
        agent: { $ref: "#/components/schemas/Agent" }
        providers:
          type: array
          description: The providers that the user added, in the order of addition.
          items: { $ref: "#/components/schemas/Provider" }
        builtins:
          type: array
          description: All pi-ai built-in providers that take an API key.
          items: { $ref: "#/components/schemas/ProviderInfo" }
        apis:
          type: object
          description: The APIs of custom providers, ID → name.
          additionalProperties: { type: string }
        telegram: { $ref: "#/components/schemas/Telegram" }
        wechat: { $ref: "#/components/schemas/Wechat" }

    Agent:
      x-go-type: settings.Agent
      x-go-type-import:
        path: github.com/recally-io/dex/internal/settings
      type: object
      required: [provider, modelId, thinkingLevel, instructions]
      properties:
        provider: { type: string }
        modelId: { type: string, description: Empty when no model is chosen. }
        thinkingLevel: { $ref: "#/components/schemas/ThinkingLevel" }
        instructions: { type: string }

    ThinkingLevel:
      type: string
      description: >
        pi-ai's ModelThinkingLevel. pi-ai sends the nearest level that the
        model supports.
      enum: [off, minimal, low, medium, high, xhigh, max]

    Provider:
      type: object
      required: [id, name, api, baseUrl, keySet, models]
      properties:
        id: { type: string }
        name: { type: string }
        api: { type: string, description: Empty for a built-in provider. }
        baseUrl: { type: string }
        keySet: { type: boolean }
        models:
          type: array
          description: Fixed model IDs; empty means the endpoint lists them.
          items: { type: string }
        modelCount:
          type: integer
          description: The number of models that the worker has for it.
        error:
          type: string
          description: Why the worker could not list its models.

    ProviderInput:
      type: object
      required: [api]
      properties:
        api: { type: string }
        name: { type: string }
        baseUrl: { type: string }
        apiKey:
          type: string
          description: Write-only. Empty keeps the saved key.
        models:
          type: array
          items: { type: string }

    ProviderInfo:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        source: { type: string }

    ModelList:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items: { $ref: "#/components/schemas/Model" }

    Model:
      type: object
      required: [provider, id, name, reasoning, input, thinkingLevels]
      properties:
        provider: { type: string }
        id: { type: string }
        name: { type: string }
        reasoning:
          type: boolean
          description: pi-ai's Model.reasoning. False means the model does not think.
        input:
          type: array
          description: pi-ai's Model.input.
          items: { type: string, enum: [text, image] }
        thinkingLevels:
          type: array
          description: pi-ai's getSupportedThinkingLevels(model).
          items: { $ref: "#/components/schemas/ThinkingLevel" }

    Extensions:
      type: object
      required: [paths, skills, servers, errors]
      properties:
        paths:
          type: object
          description: Where the agent reads its extensions.
          required: [globalSkills, globalMcp, agentSkills, agentMcp]
          properties:
            globalSkills: { type: string }
            globalMcp: { type: string }
            agentSkills: { type: string }
            agentMcp: { type: string }
        skills:
          type: array
          items: { $ref: "#/components/schemas/Skill" }
        servers:
          type: array
          items: { $ref: "#/components/schemas/McpServer" }
        errors:
          type: array
          description: >
            Files that dex cannot read. When an mcp.json file is one of them,
            no MCP server starts.
          items: { type: string }

    ExtensionScope:
      type: string
      description: global is ~/.agents/; agent is the agent directory.
      enum: [global, agent]

    Skill:
      type: object
      required: [name, description, scope, path, overrides]
      properties:
        name: { type: string }
        description: { type: string }
        scope: { $ref: "#/components/schemas/ExtensionScope" }
        path: { type: string, description: The SKILL.md file. }
        overrides:
          type: boolean
          description: The agent skill replaces a global skill with the same name.
        error:
          type: string
          description: Why the skill is not valid. The prompt does not list it.

    McpServer:
      type: object
      description: >
        An MCP server from an mcp.json file, without its command, URL, headers
        or environment, because they can hold credentials.
      required: [name, scope, overrides, state, tools]
      properties:
        name: { type: string }
        scope: { $ref: "#/components/schemas/ExtensionScope" }
        overrides:
          type: boolean
          description: The agent server replaces a global server with the same name.
        transport:
          type: string
          description: Absent for an agent entry that only turns off a global server.
          enum: [stdio, http]
        state:
          type: string
          description: idle means that the agent has not started, so dex has not connected.
          enum: [idle, connected, failed, disabled]
        tools:
          type: array
          description: The MCP tool names. The agent gets each tool as mcp__<server>__<tool>.
          items: { type: string }
        error: { type: string }

    Wechat:
      x-go-type: settings.Wechat
      x-go-type-import:
        path: github.com/recally-io/dex/internal/settings
      type: object
      required: [enabled, status]
      properties:
        enabled: { type: boolean }
        botId: { type: string }
        owner: { type: string }
        status: { $ref: "#/components/schemas/ChannelStatus" }

    WechatLogin:
      x-go-type: wechat.LoginView
      x-go-type-import:
        path: github.com/recally-io/dex/internal/wechat
      type: object
      required: [id, status, qrContent, active]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [
            wait,
            scaned,
            need_verifycode,
            verify_code_blocked,
            scaned_but_redirect,
            expired,
            binded_redirect,
            confirmed,
          ]
        qrContent: { type: string }
        active: { type: boolean }
        reason: { type: string }

    Telegram:
      type: object
      required: [enabled, allowedUsers, status]
      properties:
        enabled: { type: boolean }
        botId: { type: string }
        status: { $ref: "#/components/schemas/ChannelStatus" }
        allowedUsers:
          type: array
          items: { type: integer, format: int64 }

    ChannelStatus:
      x-go-type: channel.Status
      x-go-type-import:
        path: github.com/recally-io/dex/internal/channel
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [off, running, error, needs_login] }
        reason: { type: string }

    TelegramInput:
      type: object
      required: [token, allowedUsers]
      properties:
        token:
          type: string
          description: Write-only. Empty keeps the saved token.
        allowedUsers:
          type: array
          items: { type: integer, format: int64 }

    Feishu:
      x-go-type: settings.Feishu
      x-go-type-import:
        path: github.com/recally-io/dex/internal/settings
      type: object
      required: [enabled, appId, brand, paired, status, error]
      properties:
        enabled: { type: boolean }
        appId: { type: string }
        brand: { type: string }
        paired: { type: boolean }
        status: { type: string }
        error: { type: string }

    FeishuSetup:
      x-go-type: settings.FeishuSetup
      x-go-type-import:
        path: github.com/recally-io/dex/internal/settings
      type: object
      required: [session, qrUrl, interval, expiresIn, status, pairingCode]
      properties:
        session: { type: string }
        qrUrl: { type: string }
        interval: { type: integer }
        expiresIn: { type: integer }
        status: { type: string }
        pairingCode: { type: string }

    FeishuInput:
      type: object
      required: [appId, appSecret, brand]
      properties:
        appId: { type: string }
        appSecret:
          type: string
          description: Write-only. Empty keeps the secret for the same App ID and brand.
        brand: { type: string }

    FeishuBrand:
      type: object
      required: [brand]
      properties:
        brand: { type: string }

    FeishuPoll:
      type: object
      required: [session]
      properties:
        session: { type: string }
