openapi: 3.0.3
info:
  title: dex
  version: 0.1.0
  description: >
    The HTTP API of dex control. The web UI and local CLI use it. On a loopback
    host without DEX_TOKEN the API has no authentication. Otherwise every
    operation except POST /api/session needs the access token, as a Bearer
    token or as the session cookie. The API refuses cross-site writes.
    Times are Unix milliseconds.
    Agent resources require /api/agents/{agentId}, including the default agent.
    Un-nested agent routes return 404. Global settings contain no agent.
    Model discovery runs after HTTP startup. History reads and extension reload
    return 503 if they need to open an agent while discovery is pending. Model
    validation returns 503 if the requested model still needs discovery.
    Stored input and Stop requests remain durable until discovery finishes.
security:
  - bearer: []
  - session: []
paths:
  /api/inbox:
    get:
      operationId: listInbox
      description: Actionable routine results across all bots, newest first.
      parameters:
        - in: query
          name: includeDismissed
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Inbox results.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InboxItem" }
        default: { $ref: "#/components/responses/Error" }
  /api/inbox/{runId}/read:
    parameters:
      - in: path
        name: runId
        required: true
        schema: { type: string }
    post:
      operationId: readInboxItem
      description: Idempotently read one actionable result.
      responses:
        "200":
          description: State saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/inbox/{runId}/dismiss:
    parameters:
      - in: path
        name: runId
        required: true
        schema: { type: string }
    post:
      operationId: dismissInboxItem
      description: Idempotently dismiss one actionable result.
      responses:
        "200":
          description: State saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/session:
    post:
      operationId: createSession
      description: Exchanges the access token for the session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewSession" }
      responses:
        "204":
          description: The token is correct. The cookie holds it.
          headers:
            Set-Cookie:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: dex is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/maintenance:
    post:
      operationId: acquireMaintenance
      description: >
        Hold native admission for two minutes if no work is active. POST renews
        the lease. Web input after lease confirmation returns 409 before receipt
        storage. Input stored before confirmation can remain pending until release.
        Channel input can stay stored while the lease is active.
      responses:
        "200":
          description: Native admission is held until expiry or release.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: releaseMaintenance
      responses:
        "200":
          description: Native admission can resume.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: All settings, without secrets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        default: { $ref: "#/components/responses/Error" }

  /api/models:
    get:
      operationId: listModels
      description: The models of the providers that have credentials.
      responses:
        "200":
          description: The models.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings/providers/{providerId}:
    parameters:
      - name: providerId
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: setProvider
      description: >
        Adds or changes a provider. An empty apiKey keeps the saved key. When
        the model list of a custom provider fails, the provider is saved and
        the response has the reason in `error`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProvider
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/channels:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: getChannels
      responses:
        "200":
          description: Channel configuration and runtime status for this agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channels" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/channels/telegram/pairing:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: createTelegramPairing
      description: Creates a single-use owner pairing link. The link expires in 10 minutes.
      responses:
        "200":
          description: Pairing link
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string }
                  expiresAt: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/channels/wechat/login:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: beginWechatLogin
      description: Starts QR login. The person who confirms becomes the only allowed sender.
      responses:
        "200":
          description: QR login state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WechatLogin" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/channels/wechat/login/{loginId}/poll:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: pollWechatLogin
      description: Polls for up to 35 seconds. Saves credentials only after confirmed login.
      parameters:
        - in: path
          name: loginId
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                verifyCode: { type: string, pattern: "^[0-9]{1,16}$" }
      responses:
        "200":
          description: Current login state, with a new QR code when refreshed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WechatLogin" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/channels/wechat:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    delete:
      operationId: deleteWechat
      description: Stops WeChat and forgets its credentials. Past chats stay read-only.
      responses:
        "200":
          description: WeChat is off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/channels/telegram:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    put:
      operationId: setTelegram
      description: Saves the bot and restarts it. An empty token keeps the saved token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTelegram
      description: Turns Telegram off and forgets the token.
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/channels/feishu:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: getFeishu
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feishu" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setFeishu
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeishuInput" }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeishuSetup" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteFeishu
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/channels/feishu/registration:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: beginFeishu
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeishuBrand" }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeishuSetup" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/channels/feishu/registration/poll:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: pollFeishu
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeishuPoll" }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeishuSetup" }
        default: { $ref: "#/components/responses/Error" }

  /api/automations/preview:
    post:
      operationId: previewSchedule
      description: The next times of a schedule, as the scheduler computes them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "200":
          description: The next times.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchedulePreview" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents:
    get:
      operationId: listAgents
      description: List the owner's agents in creation order.
      responses:
        "200":
          description: The agents.
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAgent
      description: Create an agent without changing global providers or channels.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentInput" }
      responses:
        "201":
          description: The created agent with a UUID v7 ID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    get:
      operationId: getAgent
      responses:
        "200":
          description: The agent's settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateAgent
      description: Save this agent's settings. Its next message uses them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentInput" }
      responses:
        "200":
          description: The saved agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/tasks/{taskId}:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    get:
      operationId: getTask
      description: Read one task and the ID of its read-only work conversation.
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The task. Done means that it returned a report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/main:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    get:
      operationId: getMainChat
      description: Find or create the requested agent's main timeline.
      responses:
        "200":
          description: The main timeline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    get:
      operationId: listChats
      description: >
        Session summaries of the requested agent, newest activity first, then
        highest ID first. Excludes main, channel conversations, dreams and Chat sessions with no
        message. Task summaries have no reports. Transcripts are not included.
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatList" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createChat
      description: >
        Opens a separate writable Chat session. Reuses the newest Chat session
        with no message that is not archived, or creates one. No request body or model is needed.
        The first message sets its title. The session uses the bot's settings.
      responses:
        "201":
          description: The new or reused Chat session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    get:
      operationId: getChat
      responses:
        "200":
          description: The chat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/archive:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    put:
      operationId: archiveChat
      description: >
        Archives a Chat session. The session keeps its messages, records and
        files, and stays in the session list with archivedAt. Archiving an
        archived session keeps the first time. Main and the read-only kinds
        cannot be archived.
      responses:
        "200":
          description: The archived chat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: unarchiveChat
      description: Restores an archived Chat session. A session that is not archived stays as it is.
      responses:
        "200":
          description: The restored chat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/directories:
    get:
      operationId: listDirectories
      description: >
        Lists visible directories on the dex host, including symlinks to directories.
        An absent path selects home. Paths must be absolute or start with ~ or ~/.
        Entries are sorted by name without case and capped at 500.
      parameters:
        - in: query
          name: path
          schema: { type: string }
      responses:
        "200":
          description: The current directory and its visible subdirectories.
          content:
            application/json:
              schema:
                type: object
                x-go-type: chat.DirectoryListing
                x-go-type-import:
                  path: github.com/recally-io/dex/internal/chat
                required: [path, parent, home, entries, truncated]
                properties:
                  path: { type: string }
                  parent: { type: string }
                  home: { type: string }
                  truncated: { type: boolean }
                  entries:
                    type: array
                    items:
                      type: object
                      required: [name, path, git]
                      properties:
                        name: { type: string }
                        path: { type: string }
                        git: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/projects:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    get:
      operationId: listRecentProjects
      description: Returns up to eight distinct existing project directories, newest activity first.
      responses:
        "200":
          description: Recent project paths for this agent.
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/project:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    put:
      operationId: setChatProject
      description: >
        Sets the project directory of a Chat session from the next message.
        Other conversation kinds return 403. Empty cwd restores the agent workspace.
        The path must be an existing absolute directory; ~ and ~/ expand to the home directory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cwd]
              properties:
                cwd: { type: string }
      responses:
        "200":
          description: The Chat session with its saved project directory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/settings:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    put:
      operationId: setChatSettings
      description: >
        Sets the model and the thinking level of one chat. An absent field
        follows the agent's setting. They apply from the next message. Only
        automation chats accept overrides. Main and Chat sessions use agent settings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatSettings" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/messages:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    post:
      operationId: sendMessage
      description: >
        Stores a message in a web chat and returns. A message with an ID that
        exists already is not stored again. The answer comes through the
        event stream. 409 when the agent has no model. Main and Chat sessions
        take web messages. Task, automation and channel sessions return 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "202":
          description: The message is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentMessage" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/clear:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    post:
      operationId: clearContext
      description: >
        Stores a context reset in this writable session's delivery queue.
        A repeated UUID does not reset again. Refuses a busy session without a
        change. Task, automation and channel sessions return 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: {
                  type: string,
                  description: A stable client UUID for this reset.,
                }
      responses:
        "202":
          description: The reset is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentMessage" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/history:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    get:
      operationId: getChatHistory
      description: >
        Reads committed items before an entry ID, oldest first. Pages can
        overlap the live snapshot. Merge by item ID. The entry limit extends
        to an assistant or input boundary to keep tool results with their call.
      parameters:
        - in: query
          name: before
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: A history page. No nextBefore means the start was reached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryPage" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/abort:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    post:
      operationId: abortChat
      description: >
        Withdraws queued input and results, then requests cancellation of the
        current turn and background execution of this session. Earlier actions are
        not undone. Processes and remote work may continue.
        Task, automation and channel sessions return 403.
      responses:
        "200":
          description: Pending input is withdrawn and cancellation is requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/events:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    get:
      operationId: watchChat
      description: >
        Server-sent events. Each event has `event: <type>` and one `data:` line
        with a ChatEvent as JSON. The first event is a snapshot; a later
        snapshot replaces all state. A comment line comes every 15 s. The
        server closes the stream when the agent reloads, the engine closes, or
        the client is too slow. The client reconnects and gets a new snapshot.
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/ChatEvent" }
        "404": { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/uploads:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    post:
      operationId: createUpload
      description: >
        Stores one file for a later message, in the agent workspace at
        `uploads/<id>/<name>`. The agent reads it with its tools. The largest
        file is 20 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/uploads/{uploadId}:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - name: uploadId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getUpload
      description: >
        The file of an upload. PNG, JPEG, GIF and WebP images come inline with
        their type; all other files come as a download of type
        application/octet-stream.
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/extensions:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    get:
      operationId: getExtensions
      description: >
        The agent's skills and MCP servers, from ~/.agents/ and the agent
        directory. It does not start MCP servers: before the agent starts, the
        servers are idle.
      responses:
        "200":
          description: The extensions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Extensions" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/extensions/env:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    put:
      operationId: putExtensionEnv
      description: Write an agent or dex .env key. Values are write-only. Reload applies changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, key, value]
              properties:
                scope: { type: string, enum: [agent, dex] }
                key: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
                value: { type: string, writeOnly: true }
      responses:
        "200":
          description: Current extension declarations, with key names only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Extensions" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteExtensionEnv
      description: Remove an agent or dex .env key. Reload applies changes. Home is read-only.
      parameters:
        - in: query
          name: scope
          required: true
          schema: { type: string, enum: [agent, dex] }
        - in: query
          name: key
          required: true
          schema: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
      responses:
        "200":
          description: Current extension declarations, with key names only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Extensions" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/extensions/reload:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    post:
      operationId: reloadExtensions
      description: >
        Reloads only the selected agent's Harness and MCP connections. Opens
        that agent if needed and returns its server connection states. Skills
        need no reload. Checks idle execution across all agents before replacement;
        returns 409 when any agent has unfinished work. Other agents can start work
        after this check while the selected agent reloads. Returns 400 when a file
        is not valid and keeps the current resources. Returns 503 while model discovery is pending.
      responses:
        "200":
          description: The loaded extensions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Extensions" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/automations:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    get:
      operationId: listAutomations
      description: All automations of this agent, oldest first.
      responses:
        "200":
          description: The automations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationList" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAutomation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/automations/{automationId}:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/AutomationId"
    get:
      operationId: getAutomation
      responses:
        "200":
          description: The automation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateAutomation
      description: >
        Changes the automation. The next run is computed again from now, so a
        change never runs a past time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAutomation
      description: Removes the automation and its run history. Its chats stay.
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/automations/{automationId}/run:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/AutomationId"
    post:
      operationId: runAutomation
      description: >
        Runs the automation now, outside its schedule. The run is skipped when
        the agent has no model or the previous run is still busy.
      responses:
        "202":
          description: The run, started or skipped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationRun" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/automations/{automationId}/runs:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/AutomationId"
    get:
      operationId: listAutomationRuns
      description: The last 50 runs, newest first.
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationRunList" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    AgentId:
      in: path
      name: agentId
      required: true
      schema: { type: string }
    AutomationId:
      name: automationId
      in: path
      required: true
      schema: { type: string }
    ChatId:
      name: chatId
      in: path
      required: true
      schema: { type: integer, format: int64 }

  securitySchemes:
    bearer: { type: http, scheme: bearer }
    session: { type: apiKey, in: cookie, name: dex_session }

  responses:
    Error:
      description: The request failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: A message for the user. }

    NewSession:
      type: object
      required: [token]
      properties:
        token: {
          type: string,
          description: The access token. `dex token` prints the stored token.,
        }

    Ok:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }

    Health:
      type: object
      required: [status, version, dataDir, runtimeReady]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
        dataDir: { type: string }
        runtimeReady: { type: boolean }

    TaskSummary:
      type: object
      required: [
        id,
        title,
        status,
        createdAt,
        conversationId,
        parentConversationId,
      ]
      properties:
        id: { type: string }
        title: { type: string }
        status:
          type: string
          enum: [queued, running, done, failed, cancelled, interrupted]
        createdAt: { type: integer, format: int64 }
        startedAt: { type: integer, format: int64 }
        endedAt: { type: integer, format: int64 }
        conversationId: { type: integer, format: int64 }
        parentConversationId:
          type: integer
          format: int64
          description: The conversation that started this task and can stop it.
        lastAction:
          type: string
          description: The latest observed tool call, when the task is running.
        lastActivityAt:
          type: integer
          format: int64
          description: The latest engine observation of task activity, when the task is running.
        toolStartedAt:
          type: integer
          format: int64
          description: The earliest start of a currently running tool, when the task is running a tool.
        reportOutcome:
          type: string
          enum: [done, blocked, failed]
          description: The structured report outcome, when the task has a report.

    Task:
      allOf:
        - $ref: "#/components/schemas/TaskSummary"
        - type: object
          required: [report]
          properties:
            report: { type: string, description: The saved report in Markdown. }

    Chat:
      type: object
      required: [
        id,
        channel,
        title,
        createdAt,
        updatedAt,
        busy,
        settings,
        main,
        readOnly,
        cwd,
      ]
      properties:
        id: { type: integer, format: int64 }
        channel:
          type: string
          enum: [web, telegram, wechat, feishu, automation, task]
          description: External channel chats are read-only in the web UI.
        main: { type: boolean, description: This is the agent's main timeline. }
        readOnly: {
          type: boolean,
          description: The web cannot send messages to this chat.,
        }
        automationId:
          type: string
          description: The automation that created the chat.
        cwd:
          type: string
          description: The saved project directory. Empty means the agent workspace.
        title: { type: string }
        createdAt: { type: integer, format: int64 }
        updatedAt:
          type: integer
          format: int64
          description: >-
            Latest activity time, in Unix milliseconds. Includes conversation
            creation, input creation and settlement, and task start and end.
            Task times apply only to the task's own conversation.
        busy:
          type: boolean
          description: True while a message of the chat has no answer yet.
        archivedAt:
          type: integer
          format: int64
          description: >-
            When the user archived this Chat session, in Unix milliseconds.
            Absent when the session is not archived.
        settings: { $ref: "#/components/schemas/ChatSettings" }
        task:
          $ref: "#/components/schemas/TaskSummary"
          description: The saved task summary on a task session. It has no report.

    ChatSettings:
      x-go-type: chat.Settings
      x-go-type-import:
        path: github.com/recally-io/dex/internal/chat
      type: object
      description: >
        The settings that a chat overrides. An absent field follows the
        agent's setting. provider and modelId are both present or both absent.
      properties:
        provider: { type: string }
        modelId: { type: string }
        thinkingLevel: { $ref: "#/components/schemas/ThinkingLevel" }

    ChatList:
      type: object
      required: [chats]
      properties:
        chats:
          type: array
          items: { $ref: "#/components/schemas/Chat" }

    MessageInput:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
          description: A new UUID from the client. A retried request uses the same ID.
        text:
          type: string
          maxLength: 32000
          description: >
            1 to 32000 characters. It can be empty when the message has an
            attachment.
        attachments:
          type: array
          maxItems: 10
          description: Upload IDs from POST /api/agents/{agentId}/uploads, at most 10.
          items: { type: string }

    Attachment:
      x-go-type: engine.Attachment
      x-go-type-import:
        path: github.com/recally-io/dex/internal/engine
      type: object
      required: [id, name, size, mimeType, path]
      properties:
        id: { type: string }
        name: { type: string }
        size: { type: integer, format: int64, description: Bytes. }
        mimeType: { type: string }
        path:
          type: string
          description: The path in the agent workspace, uploads/<id>/<name>.

    SentMessage:
      type: object
      required: [submissionId]
      properties:
        submissionId: { type: string }

    # Automations

    Schedule:
      x-go-type: automation.Schedule
      x-go-type-import:
        path: github.com/recally-io/dex/internal/automation
      type: object
      required: [kind]
      description: >
        every: each `minutes` minutes. daily: each day at `time`. weekly: at
        `time` on `days`. once: at `at`. Times are in the automation's time
        zone.
      properties:
        kind: { type: string, enum: [every, daily, weekly, once] }
        minutes: { type: integer, minimum: 5, maximum: 10080 }
        time: { type: string, description: "HH:MM, 24 h", example: "09:00" }
        days:
          type: array
          description: ISO weekdays, 1 is Monday.
          items: { type: integer, minimum: 1, maximum: 7 }
        at: { type: integer, format: int64 }

    ScheduleInput:
      type: object
      required: [schedule, timeZone]
      properties:
        schedule: { $ref: "#/components/schemas/Schedule" }
        timeZone: {
          type: string,
          description: An IANA time zone,
          such as Asia/Shanghai.,
        }

    SchedulePreview:
      type: object
      required: [nextRuns]
      properties:
        nextRuns:
          type: array
          description: At most 3 times; empty when the schedule has no future time.
          items: { type: integer, format: int64 }

    AutomationInput:
      x-go-type: automation.Input
      x-go-type-import:
        path: github.com/recally-io/dex/internal/automation
      type: object
      required: [name, prompt, schedule, timeZone, session, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        prompt: { type: string, minLength: 1, maxLength: 32000 }
        cwd:
          type: string
          description: Existing absolute project directory. Empty uses the agent workspace.
        schedule: { $ref: "#/components/schemas/Schedule" }
        timeZone: { type: string }
        session:
          type: string
          enum: [new, reuse]
          description: >
            new: each run starts a new chat. reuse: all runs use one chat; a
            run is skipped while that chat is busy.
        enabled: { type: boolean }

    Automation:
      x-go-type: automation.Automation
      x-go-type-import:
        path: github.com/recally-io/dex/internal/automation
      allOf:
        - $ref: "#/components/schemas/AutomationInput"
        - type: object
          required: [id, nextRuns, createdAt, updatedAt]
          properties:
            id: { type: string }
            nextRuns:
              type: array
              description: At most 3 times; empty when disabled or done.
              items: { type: integer, format: int64 }
            lastRun: { $ref: "#/components/schemas/AutomationRun" }
            createdAt: { type: integer, format: int64 }
            updatedAt: { type: integer, format: int64 }

    AutomationList:
      type: object
      required: [automations]
      properties:
        automations:
          type: array
          items: { $ref: "#/components/schemas/Automation" }

    InboxItem:
      x-go-type: automation.InboxItem
      x-go-type-import:
        path: github.com/recally-io/dex/internal/automation
      type: object
      required: [
        runId,
        agentId,
        agentName,
        automationId,
        automationName,
        chatId,
        outcome,
        summary,
        createdAt,
        read,
        dismissed,
      ]
      properties:
        runId: { type: string }
        agentId: { type: string }
        agentName: { type: string }
        automationId: { type: string }
        automationName: { type: string }
        summary: { type: string }
        chatId: { type: integer, format: int64 }
        createdAt: { type: integer, format: int64 }
        outcome: { type: string, enum: [changed, failed] }
        read: { type: boolean }
        dismissed: { type: boolean }

    AutomationRun:
      x-go-type: automation.Run
      x-go-type-import:
        path: github.com/recally-io/dex/internal/automation
      type: object
      required: [id, status, createdAt, outcome, summary, duplicate]
      properties:
        id: { type: string }
        dueAt:
          type: integer
          format: int64
          description: The scheduled time; absent for a run that the user started.
        createdAt: { type: integer, format: int64 }
        status: { type: string, enum: [running, done, failed, skipped] }
        outcome:
          type: string
          enum: ["", changed, unchanged, failed]
          description: Empty before a report or for a skipped run. Terminal runs require a report or fail.
        summary: { type: string }
        changeKey: { type: string }
        duplicate:
          type: boolean
          description: An earlier completed report has the same change key. Actions are not suppressed.
        reason: { type: string }
        chatId: { type: integer, format: int64 }

    AutomationRunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/AutomationRun" }

    # Transcript

    HistoryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        nextBefore: { type: integer, format: int64 }

    BoundaryItem:
      type: object
      required: [kind, id, boundary]
      properties:
        kind: { type: string, enum: [boundary] }
        id: { type: string }
        entryId: { type: integer, format: int64 }
        boundary: { type: string, enum: [reset, compaction] }
        at: {
          type: integer,
          format: int64,
          description: The boundary time in milliseconds.,
        }

    Item:
      oneOf:
        - $ref: "#/components/schemas/UserItem"
        - $ref: "#/components/schemas/TaskItem"
        - $ref: "#/components/schemas/ThinkingItem"
        - $ref: "#/components/schemas/ToolItem"
        - $ref: "#/components/schemas/AssistantItem"
        - $ref: "#/components/schemas/ErrorItem"
        - $ref: "#/components/schemas/BoundaryItem"
      discriminator:
        propertyName: kind
        mapping:
          user: "#/components/schemas/UserItem"
          task: "#/components/schemas/TaskItem"
          thinking: "#/components/schemas/ThinkingItem"
          tool: "#/components/schemas/ToolItem"
          assistant: "#/components/schemas/AssistantItem"
          error: "#/components/schemas/ErrorItem"
          boundary: "#/components/schemas/BoundaryItem"

    UserItem:
      type: object
      required: [kind, id, text]
      properties:
        kind: { type: string, enum: [user] }
        id: { type: string }
        origin:
          type: string
          description: The input entry, such as web, telegram:7, wechat:owner or feishu:owner.
        entryId: { type: integer, format: int64 }
        text: { type: string }
        at: { type: integer, format: int64 }
        queued:
          type: boolean
          description: True while the message waits for the agent.
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }

    TaskItem:
      type: object
      description: >-
        Marks a background result. Items after this mark belong to the result
        until the next user or task item. The mark does not confirm that the
        work reached its goal.
      required: [kind, id, title, taskId]
      properties:
        kind: { type: string, enum: [task] }
        id: { type: string }
        entryId: { type: integer, format: int64 }
        at: { type: integer, format: int64 }
        title: { type: string }

        taskId: { type: string, description: The saved task ID. }

    ThinkingItem:
      type: object
      required: [kind, id, text]
      properties:
        kind: { type: string, enum: [thinking] }
        id: { type: string }
        entryId: { type: integer, format: int64 }
        text:
          type: string
          description: Empty when the provider redacted it.

    ToolItem:
      type: object
      required: [kind, id, name, args, output, status]
      properties:
        kind: { type: string, enum: [tool] }
        id: { type: string, description: The tool call ID. }
        entryId: { type: integer, format: int64 }
        name: { type: string }
        args:
          type: object
          additionalProperties: true
        output: { type: string }
        status:
          type: string
          enum: [running, done, error]
          description: A call that ended without a result is an error.
        durationMs: { type: integer, format: int64 }
        taskId: {
          type: string,
          description: The saved task ID of a successful spawn_task call.,
        }

    AssistantItem:
      type: object
      required: [kind, id, text]
      properties:
        kind: { type: string, enum: [assistant] }
        id: { type: string }
        entryId: { type: integer, format: int64 }
        text: { type: string, description: Markdown. }
        model: { type: string, description: "<provider>/<model id>" }
        usage: { $ref: "#/components/schemas/Usage" }

    ErrorItem:
      type: object
      required: [kind, id, reason]
      properties:
        kind: { type: string, enum: [error] }
        id: { type: string }
        entryId: { type: integer, format: int64 }
        reason: { type: string }
        aborted:
          type: boolean
          description: True when the user stopped the run.

    Usage:
      type: object
      required: [input, output]
      properties:
        input: { type: integer }
        output: { type: integer }

    Retry:
      type: object
      required: [attempt, at, reason]
      properties:
        attempt: { type: integer }
        at:
          type: integer
          format: int64
          description: Time of the next attempt.
        reason: { type: string }

    # Events

    ChatEvent:
      oneOf:
        - $ref: "#/components/schemas/SnapshotEvent"
        - $ref: "#/components/schemas/ItemEvent"
        - $ref: "#/components/schemas/AppendEvent"
        - $ref: "#/components/schemas/RunEvent"
      discriminator:
        propertyName: type
        mapping:
          snapshot: "#/components/schemas/SnapshotEvent"
          item: "#/components/schemas/ItemEvent"
          append: "#/components/schemas/AppendEvent"
          run: "#/components/schemas/RunEvent"

    SnapshotEvent:
      type: object
      required: [type, items, running]
      properties:
        type: { type: string, enum: [snapshot] }
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        running: { type: boolean }
        historyBefore: {
          type: integer,
          format: int64,
          description: Load history before this entry ID.,
        }
        retry: { $ref: "#/components/schemas/Retry" }

    ItemEvent:
      type: object
      required: [type, item]
      description: Adds the item, or replaces the item with the same ID.
      properties:
        type: { type: string, enum: [item] }
        item: { $ref: "#/components/schemas/Item" }

    AppendEvent:
      type: object
      required: [type, id, text]
      description: Appends text to the text of the item with this ID.
      properties:
        type: { type: string, enum: [append] }
        id: { type: string }
        text: { type: string }

    RunEvent:
      type: object
      required: [type, running]
      properties:
        type: { type: string, enum: [run] }
        running: { type: boolean }
        retry: { $ref: "#/components/schemas/Retry" }

    # Settings

    Settings:
      type: object
      required: [providers, builtins, apis]
      properties:
        providers:
          type: array
          description: The providers that the user added, in the order of addition.
          items: { $ref: "#/components/schemas/Provider" }
        builtins:
          type: array
          description: All pi-ai built-in providers that take an API key.
          items: { $ref: "#/components/schemas/ProviderInfo" }
        apis:
          type: object
          description: The APIs of custom providers, ID → name.
          additionalProperties: { type: string }

    Channels:
      x-go-type: agent.Channels
      x-go-type-import:
        path: github.com/recally-io/dex/internal/agent
      type: object
      required: [telegram, wechat, feishu]
      properties:
        telegram: { $ref: "#/components/schemas/Telegram" }
        wechat: { $ref: "#/components/schemas/Wechat" }
        feishu: { $ref: "#/components/schemas/Feishu" }

    AgentActivity:
      x-go-type: agent.Activity
      x-go-type-import:
        path: github.com/recally-io/dex/internal/agent
      type: object
      required: [
        inboxUnread,
        inboxFailed,
        routineFailed,
        activeSessions,
        runningChannels,
        enabledAutomations,
      ]
      properties:
        inboxUnread: { type: integer, format: int64 }
        inboxFailed: { type: integer, format: int64 }
        routineFailed: { type: boolean }
        activeSessions: { type: integer, format: int64 }
        runningChannels: { type: integer, format: int64 }
        enabledAutomations: { type: integer, format: int64 }

    Agent:
      x-go-type: agent.Agent
      x-go-type-import:
        path: github.com/recally-io/dex/internal/agent
      type: object
      required: [name, provider, modelId, thinkingLevel, instructions]
      properties:
        id: { type: string, readOnly: true, description: The agent ID. }
        activity:
          allOf:
            - $ref: "#/components/schemas/AgentActivity"
          readOnly: true
          description: Activity counts returned by GET /api/agents.
        name: {
          type: string,
          minLength: 1,
          maxLength: 40,
          description: The bot name. Trim spaces before validation.,
        }
        provider: { type: string }
        modelId: { type: string, description: Empty when no model is chosen. }
        thinkingLevel: { $ref: "#/components/schemas/ThinkingLevel" }
        instructions: { type: string }

    AgentInput:
      x-go-type: agent.Agent
      x-go-type-import:
        path: github.com/recally-io/dex/internal/agent
      type: object
      required: [name, provider, modelId, thinkingLevel]
      properties:
        name: {
          type: string,
          minLength: 1,
          maxLength: 40,
          description: The bot name. Trim spaces before validation.,
        }
        provider: { type: string }
        modelId: { type: string, description: Empty when no model is chosen. }
        thinkingLevel: { $ref: "#/components/schemas/ThinkingLevel" }
        instructions: { type: string }

    ThinkingLevel:
      type: string
      description: >
        pi-ai's ModelThinkingLevel. pi-ai sends the nearest level that the
        model supports.
      enum: [off, minimal, low, medium, high, xhigh, max]

    Provider:
      type: object
      required: [id, name, api, baseUrl, keySet, models]
      properties:
        id: { type: string }
        name: { type: string }
        api: { type: string, description: Empty for a built-in provider. }
        baseUrl: { type: string }
        keySet: { type: boolean }
        models:
          type: array
          description: Fixed model IDs; empty means the endpoint lists them.
          items: { type: string }
        modelCount:
          type: integer
          description: The number of models in the catalog for this provider.
        error:
          type: string
          description: Why the engine could not list this provider's models.

    ProviderInput:
      type: object
      required: [api]
      properties:
        api: { type: string }
        name: { type: string }
        baseUrl: { type: string }
        apiKey:
          type: string
          description: Write-only. Empty keeps the saved key.
        models:
          type: array
          items: { type: string }

    ProviderInfo:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        source: { type: string }

    ModelList:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items: { $ref: "#/components/schemas/Model" }

    Model:
      type: object
      required: [provider, id, name, reasoning, input, thinkingLevels]
      properties:
        provider: { type: string }
        id: { type: string }
        name: { type: string }
        reasoning:
          type: boolean
          description: pi-ai's Model.reasoning. False means the model does not think.
        input:
          type: array
          description: pi-ai's Model.input.
          items: { type: string, enum: [text, image] }
        thinkingLevels:
          type: array
          description: pi-ai's getSupportedThinkingLevels(model).
          items: { $ref: "#/components/schemas/ThinkingLevel" }

    Extensions:
      type: object
      required: [levels, skills, servers, env, warnings, errors]
      properties:
        levels:
          type: array
          description: >
            The .agents directories, from wide to narrow. Each can hold skills/,
            mcp.json and .env. Two levels can have the same directory.
          items:
            type: object
            required: [scope, dir]
            properties:
              scope: { $ref: "#/components/schemas/ExtensionScope" }
              dir: { type: string }
        skills:
          type: array
          description: Current disk declarations; skills are read before each model request.
          items: { $ref: "#/components/schemas/Skill" }
        servers:
          type: array
          description: Loaded servers, or idle declarations before the agent opens.
          items: { $ref: "#/components/schemas/McpServer" }
        env:
          type: array
          description: Names only. Values never leave the loader through this API.
          items:
            type: object
            required: [key, scope, shadowed]
            properties:
              key: { type: string }
              scope: { $ref: "#/components/schemas/ExtensionScope" }
              shadowed: { type: boolean }
        warnings:
          type: array
          items: { type: string }
        errors:
          type: array
          description: Invalid configuration prevents MCP startup and reload.
          items: { type: string }

    ExtensionScope:
      type: string
      description: Home, resolved data directory, or agent home, each under .agents/.
      enum: [home, dex, agent]

    Skill:
      type: object
      required: [name, description, scope, path, overrides]
      properties:
        name: { type: string }
        description: { type: string }
        scope:
          type: string
          description: >
            A file level, or project for .agents/skills under the agent workspace. The
            prompt reads the project level under the conversation's cwd.
          enum: [home, dex, agent, project]
        path: { type: string, description: The SKILL.md file. }
        overrides:
          type: boolean
          description: The skill replaces a wider skill with the same name.
        error:
          type: string
          description: Why the skill is not valid. The prompt does not list it.

    McpServer:
      type: object
      description: >
        An MCP server from an mcp.json file, without its command, URL, headers
        or environment, because they can hold credentials.
      required: [name, scope, overrides, state, tools]
      properties:
        name: { type: string }
        scope: { $ref: "#/components/schemas/ExtensionScope" }
        overrides:
          type: boolean
          description: The server replaces a wider server with the same name.
        transport:
          type: string
          description: Absent for an agent entry that only turns off a global server.
          enum: [stdio, http]
        state:
          type: string
          description: idle means that the agent has not started, so dex has not connected.
          enum: [idle, connected, failed, disabled]
        tools:
          type: array
          description: The MCP tool names. The agent gets each tool as mcp__<server>__<tool>.
          items: { type: string }
        error: { type: string }

    Wechat:
      x-go-type: agent.Wechat
      x-go-type-import:
        path: github.com/recally-io/dex/internal/agent
      type: object
      required: [enabled, status]
      properties:
        enabled: { type: boolean }
        botId: { type: string }
        owner: { type: string }
        status: { $ref: "#/components/schemas/ChannelStatus" }

    WechatLogin:
      x-go-type: wechat.LoginView
      x-go-type-import:
        path: github.com/recally-io/dex/internal/wechat
      type: object
      required: [id, status, qrContent, active]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [
            wait,
            scaned,
            need_verifycode,
            verify_code_blocked,
            scaned_but_redirect,
            expired,
            binded_redirect,
            confirmed,
          ]
        qrContent: { type: string }
        active: { type: boolean }
        reason: { type: string }

    Telegram:
      type: object
      required: [enabled, allowedUsers, status]
      properties:
        enabled: { type: boolean }
        botId: { type: string }
        status: { $ref: "#/components/schemas/ChannelStatus" }
        allowedUsers:
          type: array
          items: { type: integer, format: int64 }

    ChannelStatus:
      x-go-type: channel.Status
      x-go-type-import:
        path: github.com/recally-io/dex/internal/channel
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [off, running, error, needs_login] }
        reason: { type: string }

    TelegramInput:
      type: object
      required: [token, allowedUsers]
      properties:
        token:
          type: string
          description: Write-only. Empty keeps the saved token.
        allowedUsers:
          type: array
          items: { type: integer, format: int64 }

    Feishu:
      x-go-type: agent.Feishu
      x-go-type-import:
        path: github.com/recally-io/dex/internal/agent
      type: object
      required: [enabled, appId, brand, paired, status, error]
      properties:
        enabled: { type: boolean }
        appId: { type: string }
        brand: { type: string }
        paired: { type: boolean }
        status: { type: string }
        error: { type: string }

    FeishuSetup:
      x-go-type: agent.FeishuSetup
      x-go-type-import:
        path: github.com/recally-io/dex/internal/agent
      type: object
      required: [session, qrUrl, interval, expiresIn, status, pairingCode]
      properties:
        session: { type: string }
        qrUrl: { type: string }
        interval: { type: integer }
        expiresIn: { type: integer }
        status: { type: string }
        pairingCode: { type: string }

    FeishuInput:
      type: object
      required: [appId, appSecret, brand]
      properties:
        appId: { type: string }
        appSecret:
          type: string
          description: Write-only. Empty keeps the secret for the same App ID and brand.
        brand: { type: string }

    FeishuBrand:
      type: object
      required: [brand]
      properties:
        brand: { type: string }

    FeishuPoll:
      type: object
      required: [session]
      properties:
        session: { type: string }
