        mode,
        maxRuns,
        runs,
        expiresAt,
        outcome,
      ]
      properties:
        id: { type: string }
        dueAt: { type: integer, format: int64 }
        timeZone: { type: string }
        prompt: { type: string }
        state:
          type: string
          enum: [scheduled, fired, cancelled, expired]
        chainDepth: { type: integer }
        createdAt: { type: integer, format: int64 }
        mode: { type: string, enum: [prompt, script] }
        maxRuns: { type: integer }
        runs: { type: integer }
        expiresAt: {
          type: integer,
          format: int64,
          description: Deadline in milliseconds since epoch (0 for legacy one-shot grace).,
        }
        outcome: {
          type: string,
          description: Last check or stop outcome (empty before the first check).,
        }

    MonitorList:
      type: object
      required: [monitors]
      properties:
        monitors:
          type: array
          items: { $ref: "#/components/schemas/Monitor" }

