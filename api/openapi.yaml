openapi: 3.0.3
info:
  title: dex
  version: 0.1.0
  description: >
    The HTTP API of dex control. The web UI and local CLI use it. On a loopback
    host without DEX_TOKEN the API has no authentication. Otherwise every
    operation except POST /api/session needs the access token, as a Bearer
    token or as the session cookie. The API refuses cross-site writes.
    Times are Unix milliseconds.
    Agent resources require /api/agents/{agentId}, including the default agent.
    Un-nested agent routes return 404. Global settings contain no agent.
    Model discovery runs after HTTP startup. History reads and extension reload
    return 503 if they need to open an agent while discovery is pending. Model
    validation returns 503 if the requested model still needs discovery.
    Stored input and Stop requests remain durable until discovery finishes.
security:
  - bearer: []
  - session: []
paths:
  /api/plugins/github/agents/{agentId}/tasks/{taskId}/pull:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - in: path
        name: taskId
        required: true
        schema: { type: string }
    put:
      operationId: bindTaskGitHubPull
      tags: [github]
      description: Bind a GitHub PR to one Task. Optionally add a wait for a review of a specific commit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repositoryId, pullNumber]
              properties:
                repositoryId: { type: integer, format: int64, minimum: 1 }
                pullNumber: { type: integer, format: int64, minimum: 1 }
                wait:
                  type: object
                  required: [revision, afterAt]
                  properties:
                    revision: { type: string, minLength: 1, maxLength: 512 }
                    afterAt:
                      type: integer
                      format: int64
                      minimum: 1
                      description: Reviews must be submitted strictly after this Unix time in milliseconds.
                    alert:
                      type: boolean
                      description: When a review resolves the wait, send Main a Task alert. The default is false.
      responses:
        "204": { description: PR bound. }
        default: { $ref: "#/components/responses/Error" }
  /api/plugins/github/review-pulls/{repositoryId}/{pullNumber}:
    parameters:
      - in: path
        name: repositoryId
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
      - in: path
        name: pullNumber
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    put:
      operationId: saveGitHubReviewPull
      tags: [github]
      description: Enable scheduled review pulls for one PR with a write-only GitHub token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {
                  type: string,
                  minLength: 1,
                  maxLength: 512,
                  writeOnly: true,
                }
      responses:
        "204": { description: Pull configuration saved. }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteGitHubReviewPull
      tags: [github]
      description: Disable scheduled review pulls for one PR.
      responses:
        "204": { description: Pull disabled. }
        default: { $ref: "#/components/responses/Error" }
  /api/plugins/email/sources/{sourceId}/imap:
    parameters:
      - in: path
        name: sourceId
        required: true
        schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
    put:
      operationId: saveEmailIMAPPull
      tags: [email]
      description: Read one IMAP folder for this email source once per minute. A new configuration starts at the next message of the folder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, username, password]
              properties:
                address:
                  type: string
                  description: imaps://host[:port]. Use imap://host[:port] only for a loopback host, such as a local mail bridge.
                username: { type: string, minLength: 1, maxLength: 320 }
                password: {
                  type: string,
                  minLength: 1,
                  maxLength: 1024,
                  writeOnly: true,
                }
                folder:
                  type: string
                  minLength: 1
                  maxLength: 255
                  default: INBOX
                  description: A dedicated folder. Pull opens it read-only.
      responses:
        "204": { description: Pull saved. }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteEmailIMAPPull
      tags: [email]
      description: Stop reading the folder. Recorded events stay.
      responses:
        "204": { description: Pull disabled. }
        default: { $ref: "#/components/responses/Error" }
  /api/plugins/email/sources/{sourceId}:
    parameters:
      - in: path
        name: sourceId
        required: true
        schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
    put:
      operationId: saveEmailSource
      tags: [email]
      description: Save a signed email source. A mail forwarding service posts raw RFC 5322 messages to POST /hooks/email/{sourceId}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret: {
                  type: string,
                  minLength: 32,
                  maxLength: 256,
                  writeOnly: true,
                }
                taskAgentId:
                  type: string
                  description: Create a Task under this agent for a new thread. Omit to disable creation.
                holdUnmatched:
                  type: boolean
                  default: false
                  description: Hold other unmatched messages in the Inbox. The default ignores them.
      responses:
        "204": { description: Source saved. }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteEmailSource
      tags: [email]
      description: Disable the source. Recorded events stay.
      responses:
        "204": { description: Source disabled. }
        default: { $ref: "#/components/responses/Error" }
  /api/plugins/webhook/sources/{sourceId}:
    parameters:
      - in: path
        name: sourceId
        required: true
        schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
    put:
      operationId: saveWebhookSource
      tags: [webhook]
      description: Save a signed Webhook source. The source sends normalized Task events to POST /hooks/webhook/{sourceId}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret: {
                  type: string,
                  minLength: 32,
                  maxLength: 256,
                  writeOnly: true,
                }
                taskAgentId:
                  type: string
                  description: Create a Task under this agent for an unmatched event with exactly one object. Omit to disable creation.
                holdUnmatched:
                  type: boolean
                  default: false
                  description: Hold other unmatched events in the Inbox. The default ignores them.
      responses:
        "204": { description: Source saved. }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteWebhookSource
      tags: [webhook]
      description: Disable the source. Recorded events stay.
      responses:
        "204": { description: Source disabled. }
        default: { $ref: "#/components/responses/Error" }
  /api/plugins/github/webhooks/{repositoryId}:
    parameters:
      - in: path
        name: repositoryId
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    put:
      operationId: saveGitHubWebhook
      tags: [github]
      description: Save a GitHub Webhook secret and optional destination for new Issues.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret: {
                  type: string,
                  minLength: 32,
                  maxLength: 256,
                  writeOnly: true,
                }
                issueAgentId:
                  type: string
                  description: Create Tasks for opened Issues under this agent. Omit to disable creation.
                holdUnmatched:
                  type: boolean
                  default: false
                  description: Hold Webhook and Pull events that match no Task in the Inbox. The default ignores them.
      responses:
        "204": { description: Webhook configuration saved. }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteGitHubWebhook
      tags: [github]
      description: Disable the Webhook for this repository.
      responses:
        "204": { description: Webhook disabled. }
        default: { $ref: "#/components/responses/Error" }
  /api/tasks:
    get:
      operationId: listTasks
      parameters:
        - in: query
          name: botId
          schema: { type: string }
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/TaskStatus" }
        - in: query
          name: blocked
          schema: { type: boolean }
        - in: query
          name: inReview
          schema: { type: boolean }
        - in: query
          name: source
          description: A linked Source namespace or its prefix before a slash.
          schema: { type: string }
        - in: query
          name: includeClosed
          schema: { type: boolean }
      responses:
        "200":
          description: Tasks for the Owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskList" }
        "400": { $ref: "#/components/responses/Error" }
    post:
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCreate" }
      responses:
        "201":
          description: Created Task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSummary" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/tasks/{taskKey}:
    parameters:
      - $ref: "#/components/parameters/TaskKey"
    get:
      operationId: getTask
      responses:
        "200":
          description: Task, related Tasks, and timeline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateTask
      parameters:
        - $ref: "#/components/parameters/TaskRevision"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskUpdate" }
      responses:
        "200":
          description: Updated Task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSummary" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }

  /api/tasks/{taskKey}/split:
    parameters:
      - $ref: "#/components/parameters/TaskKey"
    post:
      operationId: splitTask
      parameters:
        - $ref: "#/components/parameters/TaskRevision"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskSplit" }
      responses:
        "201":
          description: Created subtask.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSummary" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }

  /api/tasks/{taskKey}/dependencies:
    parameters:
      - $ref: "#/components/parameters/TaskKey"
    post:
      operationId: addTaskDependency
      parameters:
        - $ref: "#/components/parameters/TaskRevision"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskDependencyCreate" }
      responses:
        "204":
          description: The sibling dependency exists.
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }

  /api/tasks/{taskKey}/dependencies/{depKey}:
    parameters:
      - $ref: "#/components/parameters/TaskKey"
      - in: path
        name: depKey
        required: true
        schema: { type: string }
    delete:
      operationId: removeTaskDependency
      parameters:
        - $ref: "#/components/parameters/TaskRevision"
      responses:
        "204":
          description: The sibling dependency does not exist.
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }

  /api/tasks/{taskKey}/entries:
    parameters:
      - $ref: "#/components/parameters/TaskKey"
    post:
      operationId: createTaskEntry
      parameters:
        - $ref: "#/components/parameters/TaskRevision"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskEntryCreate" }
      responses:
        "201":
          description: Appended entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskEntry" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }

  /api/tasks/{taskKey}/review:
    parameters:
      - $ref: "#/components/parameters/TaskKey"
    post:
      operationId: reviewTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskReview" }
      responses:
        "200":
          description: Reviewed Task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSummary" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/tasks/{taskKey}/executions/attach:
    parameters:
      - $ref: "#/components/parameters/TaskKey"
    post:
      operationId: attachTaskExecution
      description: Attach an external agent. The harness field is required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskExecutionAttach" }
      responses:
        "201":
          description: Execution and one-time Task token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskTokenIssue" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/tasks/executions/{executionId}/resume:
    parameters:
      - name: executionId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: resumeTaskExecution
      description: Replace the claim. Supplied binding fields must match the current execution.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskExecutionAttach" }
      responses:
        "200":
          description: Execution and one-time Task token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskTokenIssue" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/tasks/executions:
    get:
      operationId: listTaskExecutions
      parameters:
        - name: taskKey
          in: query
          schema: { type: string }
        - name: machineId
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Request succeeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskExecutionList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/tasks/external/task:
    get:
      operationId: readTaskExternalTask
      security:
        - TaskToken: []
      parameters:
        - name: afterSeq
          in: query
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Request succeeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskExternalTask" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: The execution lease has expired or the claim is no longer current. Error is claim_lost.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/tasks/external/entries:
    post:
      operationId: postTaskExternalEntry
      security:
        - TaskToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskEntryCreate" }
      responses:
        "201":
          description: Request succeeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskEntry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: The execution lease has expired or the claim is no longer current. Error is claim_lost.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/tasks/external/heartbeat:
    post:
      operationId: heartbeatTaskExecution
      security:
        - TaskToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskExecutionHeartbeat" }
      responses:
        "200":
          description: Request succeeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskExecution" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: The execution lease has expired or the claim is no longer current. Error is claim_lost.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/tasks/external/finish:
    post:
      operationId: finishTaskExecution
      security:
        - TaskToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskExecutionFinish" }
      responses:
        "200":
          description: Request succeeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskExecution" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: The execution lease has expired or the claim is no longer current. Error is claim_lost.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/tasks/events:
    get:
      operationId: streamTaskEvents
      description: >
        Server-sent events. Each task_entry event has a global ledger ID and a TaskEvent JSON body.
        Last-Event-ID takes precedence over after. Without a cursor, the stream starts at the current
        head. A task_ready event marks the end of catch-up. A task_refresh event signals
        a change to a related projection without advancing the cursor. A comment comes every 15 s.
      parameters:
        - in: header
          name: Last-Event-ID
          schema: { type: string }
        - in: query
          name: after
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: The Task event stream.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/TaskEvent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /api/inbox/summary:
    get:
      operationId: getInboxSummary
      description: Sessions and automation activity across bots.
      responses:
        "200":
          description: Inbox summary across Bots.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxSummary" }
        default: { $ref: "#/components/responses/Error" }
  /api/inbox:
    get:
      operationId: listInbox
      description: Actionable routine results across all bots, newest first.
      parameters:
        - in: query
          name: includeDismissed
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Inbox results.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InboxItem" }
        default: { $ref: "#/components/responses/Error" }
  /api/inbox/held-events:
    get:
      operationId: listHeldEvents
      description: The newest 100 source events that wait for the owner.
      responses:
        "200":
          description: Held events.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/HeldEvent" }
        default: { $ref: "#/components/responses/Error" }
  /api/inbox/held-events/{eventId}/attach:
    parameters:
      - in: path
        name: eventId
        required: true
        schema: { type: string }
    post:
      operationId: attachHeldEvent
      description: Add a held event to an open Task and link its objects that have no Task. This does not resolve a wait or alert Main.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId, taskId]
              properties:
                agentId: { type: string }
                taskId: { type: string }
      responses:
        "204": { description: Event attached. }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/inbox/held-events/{eventId}/dismiss:
    parameters:
      - in: path
        name: eventId
        required: true
        schema: { type: string }
    post:
      operationId: dismissHeldEvent
      description: Remove a held event from the Inbox. Dex keeps the event record.
      responses:
        "204": { description: Event dismissed. }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/inbox/{runId}/read:
    parameters:
      - in: path
        name: runId
        required: true
        schema: { type: string }
    post:
      operationId: readInboxItem
      description: Idempotently read one actionable result.
      responses:
        "200":
          description: State saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/inbox/{runId}/dismiss:
    parameters:
      - in: path
        name: runId
        required: true
        schema: { type: string }
    post:
      operationId: dismissInboxItem
      description: Idempotently dismiss one actionable result.
      responses:
        "200":
          description: State saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/session:
    post:
      operationId: createSession
      description: Exchanges the access token for the session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewSession" }
      responses:
        "204":
          description: The token is correct. The cookie holds it.
          headers:
            Set-Cookie:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: dex is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/maintenance:
    post:
      operationId: acquireMaintenance
      description: >
        Hold native admission for two minutes if no work is active. POST renews
        the lease. Web input after lease confirmation returns 409 before receipt
        storage. Input stored before confirmation can remain pending until release.
        Channel input can stay stored while the lease is active.
      responses:
        "200":
          description: Native admission is held until expiry or release.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: releaseMaintenance
      responses:
        "200":
          description: Native admission can resume.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/system/status:
    get:
      operationId: getSystemStatus
      description: Return server version, update channel, upgrade capability, pending operation state, and database backups.
      responses:
        "200":
          description: Current system status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        default: { $ref: "#/components/responses/Error" }

  /api/system/settings:
    put:
      operationId: updateSystemSettings
      description: Save global system settings such as the release update channel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updateChannel]
              properties:
                updateChannel: {
                  $ref: "#/components/schemas/SystemUpdateChannel",
                }
      responses:
        "200":
          description: Updated system status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        default: { $ref: "#/components/responses/Error" }

  /api/system/check-update:
    post:
      operationId: checkSystemUpdate
      description: Check GitHub Releases for a newer dex version on the configured channel.
      responses:
        "200":
          description: Updated system status with latest release details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        default: { $ref: "#/components/responses/Error" }

  /api/system/upgrade:
    post:
      operationId: upgradeSystem
      description: Download, verify, back up control.sqlite, and restart into a newer release.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string, maxLength: 128 }
                force: { type: boolean }
      responses:
        "200":
          description: Upgrade started or scheduled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/system/restart:
    post:
      operationId: restartSystem
      description: Gracefully restart the dex server in place once idle, or immediately when forced.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean }
      responses:
        "200":
          description: Restart started or waiting for active runs to settle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/system/cancel:
    post:
      operationId: cancelSystemOperation
      description: Cancel a pending restart or upgrade that is waiting for active runs to settle.
      responses:
        "200":
          description: Updated system status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        default: { $ref: "#/components/responses/Error" }

  /api/system/backup:
    post:
      operationId: backupSystemDatabase
      description: Create a consistent hot backup of control.sqlite in the data directory backups folder.
      responses:
        "200":
          description: Created backup metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemBackup" }
        default: { $ref: "#/components/responses/Error" }

  /api/system/logs:
    get:
      operationId: getSystemLogs
      description: Return recent structured server log entries from the in-memory ring buffer.
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Recent server log entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemLogs" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings/plugins:
    get:
      operationId: listPlugins
      description: List the plugins of this build, the stored choice, and whether each one runs now.
      responses:
        "200":
          description: The plugins.
          content:
            application/json:
              schema:
                type: object
                required: [plugins]
                properties:
                  plugins:
                    type: array
                    items: { $ref: "#/components/schemas/PluginSetting" }
        default: { $ref: "#/components/responses/Error" }
  /api/settings/plugins/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    put:
      operationId: setPlugin
      description: Turn a plugin on or off. The change takes effect when dex starts again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "204": { description: Choice saved. }
        default: { $ref: "#/components/responses/Error" }
  /api/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: All settings, without secrets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings/onepassword:
    get:
      operationId: getOnePassword
      responses:
        "200":
          description: The 1Password settings, without tokens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnePassword" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setOnePassword
      description: >
        Saves how tools authenticate the 1Password CLI. An empty or missing token keeps
        the saved token. Open agents apply the change when all agents are idle.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnePasswordInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnePassword" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings/environments:
    get:
      operationId: listEnvironments
      description: Saved execution environments, without secrets. Built-in local is implicit when a bot has empty environmentId.
      responses:
        "200":
          description: Execution environments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createEnvironment
      description: Creates a new execution environment.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings/environments/ssh-config:
    get:
      operationId: discoverSshConfig
      description: Discovers concrete SSH host aliases from ~/.ssh/config and candidate private key paths under ~/.ssh/. Never reads private key contents.
      responses:
        "200":
          description: Discovered SSH hosts and identity file paths.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SshConfigDiscovery" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings/environments/probe:
    post:
      operationId: probeEnvironment
      description: Probes connectivity for an unsaved or edited execution environment configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentProbeInput" }
      responses:
        "200":
          description: Probe result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentTestResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings/environments/{environmentId}:
    parameters:
      - $ref: "#/components/parameters/EnvironmentId"
    put:
      operationId: updateEnvironment
      description: Updates an execution environment. Empty or omitted secret keeps the saved secret. Open bots using it reload when idle.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteEnvironment
      description: Deletes an execution environment if no active bot uses it (409 when in use).
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings/environments/{environmentId}/test:
    parameters:
      - $ref: "#/components/parameters/EnvironmentId"
    post:
      operationId: testEnvironment
      description: Probes connectivity, platform metadata, and base workspace readiness.
      responses:
        "200":
          description: Probe result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentTestResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings/environments/{environmentId}/forget-host-key:
    parameters:
      - $ref: "#/components/parameters/EnvironmentId"
    post:
      operationId: forgetEnvironmentHostKey
      description: Removes stored SSH host key entries for an SSH environment so the next test or open re-trusts the host key via TOFU.
      responses:
        "200":
          description: Host key cleared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings/environments/{environmentId}/runner-pairing:
    parameters:
      - $ref: "#/components/parameters/EnvironmentId"
    post:
      operationId: issueRunnerCode
      description: Creates a one-time enrollment code for a remote machine.
      responses:
        "200":
          description: Pairing code. It expires after ten minutes.
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: { type: string }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: revokeRunner
      description: Revokes the machine certificate and ends the active connection.
      responses:
        "200":
          description: Credential revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        default: { $ref: "#/components/responses/Error" }

  /api/models:
    get:
      operationId: listModels
      description: The models of the providers that have credentials.
      responses:
        "200":
          description: The models.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings/provider-models:
    post:
      operationId: listProviderModels
      description: >
        Lists the models of a custom provider endpoint and saves nothing. An
        empty apiKey uses the saved key of the custom provider providerId.
        400 when the endpoint does not give a model list.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderModelsInput" }
      responses:
        "200":
          description: The models of the endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderModelList" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings/providers/{providerId}:
    parameters:
      - name: providerId
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: setProvider
      description: >
        Adds or changes a provider. An empty apiKey keeps the saved key. When
        the model list of a custom provider fails, the provider is saved and
        the response has the reason in `error`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProvider
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/channels:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: getChannels
      responses:
        "200":
          description: Channel configuration and runtime status for this agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channels" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/notification-targets:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: getNotificationTargets
      responses:
        "200":
          description: This agent's authorized notification destinations and default.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTargets" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setPrimaryNotificationTarget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetId]
              properties:
                targetId: {
                  type: string,
                  description: Empty clears the default.,
                }
      responses:
        "200":
          description: Default saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        default: { $ref: "#/components/responses/Error" }

  /api/telegram/manager:
    put:
      operationId: setTelegramManager
      description: Sets a dedicated manager bot. An empty token removes it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, writeOnly: true }
      responses:
        "200":
          description: Manager setting saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/channels/telegram/managed:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: beginTelegramManagedSetup
      description: Creates a setup and a private Telegram link to verify the owner.
      responses:
        "200":
          description: Setup started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelegramManagedSetup" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/channels/telegram/managed/{setupId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - name: setupId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getTelegramManagedSetup
      responses:
        "200":
          description: Setup state and the current Telegram link, if any.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelegramManagedSetup" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: cancelTelegramManagedSetup
      description: Cancels an unfinished setup. Does not change the saved channel.
      responses:
        "200":
          description: Setup canceled or already closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/channels/telegram/pairing:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: createTelegramPairing
      description: Creates a single-use owner pairing link. The link expires in 10 minutes.
      responses:
        "200":
          description: Pairing link
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string }
                  expiresAt: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/channels/wechat/login:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: beginWechatLogin
      description: Starts QR login. The person who confirms becomes the only allowed sender.
      responses:
        "200":
          description: QR login state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WechatLogin" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/channels/wechat/login/{loginId}/poll:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: pollWechatLogin
      description: Polls for up to 35 seconds. Saves credentials only after confirmed login.
      parameters:
        - in: path
          name: loginId
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                verifyCode: { type: string, pattern: "^[0-9]{1,16}$" }
      responses:
        "200":
          description: Current login state, with a new QR code when refreshed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WechatLogin" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/channels/wechat:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    delete:
      operationId: deleteWechat
      description: Stops WeChat and forgets its credentials. Past chats stay read-only.
      responses:
        "200":
          description: WeChat is off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/channels/telegram:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    put:
      operationId: setTelegram
      description: Saves the bot and restarts it. An empty token keeps the saved token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTelegram
      description: Turns Telegram off and forgets the token.
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/channels/feishu:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: getFeishu
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feishu" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setFeishu
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeishuInput" }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeishuSetup" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteFeishu
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/channels/feishu/registration:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: beginFeishu
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeishuBrand" }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeishuSetup" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/channels/feishu/registration/poll:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: pollFeishu
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeishuPoll" }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeishuSetup" }
        default: { $ref: "#/components/responses/Error" }

  /api/automations/preview:
    post:
      operationId: previewSchedule
      description: The next times of a schedule, as the scheduler computes them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "200":
          description: The next times.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchedulePreview" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents:
    get:
      operationId: listAgents
      description: List the owner's agents in creation order.
      responses:
        "200":
          description: The agents.
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAgent
      description: Create an agent without changing global providers or channels.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgentInput" }
      responses:
        "201":
          description: The created agent with a UUID v7 ID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    get:
      operationId: getAgent
      responses:
        "200":
          description: The agent's settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateAgent
      description: Save this agent's settings. Its next message uses them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentInput" }
      responses:
        "200":
          description: The saved agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/archived-agents:
    get:
      operationId: listArchivedAgents
      description: List the archived agents, newest archive first. GET /api/agents omits them.
      responses:
        "200":
          description: The archived agents.
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/archive:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    delete:
      operationId: restoreAgent
      description: >
        Restores an archived agent and starts its saved channels. An agent that is not archived
        answers 404. There is no archive route: an agent is archived only when the owner approves
        a bot_delete question. Every other agent route answers 404 for an archived agent.
      responses:
        "200":
          description: The restored agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/environments:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    get:
      operationId: listAgentEnvironments
      description: >
        Lists the execution environments for the sessions of the agent: the environment of the
        agent first (default), then local and the other registered environments. Each entry
        has a status, but no configuration or secrets. Registration does not guarantee connectivity.
      responses:
        "200":
          description: The session environments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentEnvironments" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/environment/reset:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    post:
      operationId: resetAgentEnvironment
      description: >
        Kills any persisted E2B sandbox for an idle agent, clears its sandbox ID,
        and releases open resources so the next turn provisions a fresh sandbox.
      responses:
        "200":
          description: Reset completed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/main:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    get:
      operationId: getMainChat
      description: Find or create the requested agent's main timeline.
      responses:
        "200":
          description: The main timeline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    get:
      operationId: listChats
      description: >
        Session summaries of the requested agent, newest activity first, then
        highest ID first. Excludes main, channel conversations, dreams and Chat sessions with no
        message. Transcripts are not included.
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatList" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createChat
      description: >
        Opens a separate writable Chat session. Reuses the newest Chat session
        with no message that is not archived, or creates one. No request body or model is needed.
        The first message sets its title. The session uses the bot's settings.
      responses:
        "201":
          description: The new or reused Chat session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    get:
      operationId: getChat
      responses:
        "200":
          description: The chat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/archive:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    put:
      operationId: archiveChat
      description: >
        Archives a Chat session. The session keeps its messages, records and
        files, and stays in the session list with archivedAt. Archiving an
        archived session keeps the first time. Main and the read-only kinds
        cannot be archived.
      responses:
        "200":
          description: The archived chat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: unarchiveChat
      description: Restores an archived Chat session. A session that is not archived stays as it is.
      responses:
        "200":
          description: The restored chat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/directories:
    get:
      operationId: listDirectories
      description: >
        Lists visible directories in the selected agent's execution environment, including symlinks
        to directories. An absent path selects home. Paths must be absolute or start with ~ or ~/.
        Entries are sorted by name without case and capped at 500.
      parameters:
        - in: query
          name: path
          schema: { type: string }
        - in: query
          name: agentId
          schema: { type: string }
        - in: query
          name: environmentId
          description: An execution environment of the agent. Absent selects the environment of the agent.
          schema: { type: string }
      responses:
        "200":
          description: The current directory and its visible subdirectories.
          content:
            application/json:
              schema:
                type: object
                x-go-type: chat.DirectoryListing
                x-go-type-import:
                  path: github.com/recally-io/dex/internal/chat
                required: [path, parent, home, entries, truncated]
                properties:
                  path: { type: string }
                  parent: { type: string }
                  home: { type: string }
                  truncated: { type: boolean }
                  entries:
                    type: array
                    items:
                      type: object
                      required: [name, path, git]
                      properties:
                        name: { type: string }
                        path: { type: string }
                        git: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/projects:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    get:
      operationId: listRecentProjects
      description: >
        Returns up to eight distinct project directories that exist in the execution environment,
        newest activity first.
      parameters:
        - in: query
          name: environmentId
          description: An execution environment of the agent. Absent selects the environment of the agent.
          schema: { type: string }
      responses:
        "200":
          description: Recent project paths for this agent.
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/environment:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    put:
      operationId: setChatEnvironment
      description: >
        Selects the execution environment of a Chat session before its first message. The command
        and file tools of the chat run there. Empty environmentId makes the chat follow the
        environment of the agent. The selection clears the project directory. The environment must
        be local or a registered SSH, runner, or E2B environment (400). A chat that has started answers
        409: fork it instead. Read-only conversations return 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environmentId]
              properties:
                environmentId: { type: string }
      responses:
        "200":
          description: The Chat session with its environment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/project:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    put:
      operationId: setChatProject
      description: >
        Sets the project directory of a conversation from the next message. It applies to
        every conversation that accepts messages: Main, Chat sessions, and child sessions
        (child sessions too). Read-only conversations return 403. Empty cwd restores the agent workspace.
        The path must be an existing absolute directory; ~ and ~/ expand to the home directory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cwd]
              properties:
                cwd: { type: string }
      responses:
        "200":
          description: The Chat session with its saved project directory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/settings:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    put:
      operationId: setChatSettings
      description: >
        Sets the model and the thinking level of one chat. An absent field
        follows the agent's setting. They apply from the next message, including
        channel input on Main. Conversations that accept messages (Main, Chat
        sessions, child sessions) and automation chats accept
        overrides. Other read-only conversations return 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatSettings" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/messages:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    post:
      operationId: sendMessage
      description: >
        Stores a message in a web chat and returns. An identical retry of an
        accepted message returns 202 with the same submissionId. A retry with the same ID and different
        text, attachments, mode, or chat returns 409. The answer comes through
        the event stream. 409 when the agent has no model, or when the mode is
        reject and the agent is working in the chat. Main and Chat sessions
        take web messages. Automation and channel sessions return 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "202":
          description: The message is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentMessage" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/messages/{messageId}/withdraw:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
      - in: path
        name: messageId
        required: true
        schema: { type: string }
    post:
      operationId: withdrawMessage
      description: >
        Withdraws one message that waits in the queue and returns its text and
        attachments. The native queue decides whether the message is still
        queued. The receipt and the source key stay, so a channel redelivery
        does not run the message. A repeated request returns the same result.
        409 when the message has started or finished. A withdrawn answer to a
        question opens the question again. Main and Chat sessions take this
        request. Automation and channel sessions return 403.
      responses:
        "200":
          description: The message is withdrawn.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WithdrawnMessage" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/clear:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    post:
      operationId: clearContext
      description: >
        Stores a context reset in this writable session's delivery queue.
        A repeated UUID does not reset again; the same UUID with another
        handoff or chat returns 409. Refuses a busy session without a change.
        Automation and channel sessions return 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: {
                  type: string,
                  description: A stable client UUID for this reset.,
                }
                handoff:
                  type: string
                  maxLength: 32000
                  description: >
                    Text that starts the new context as its first user
                    message. It does not start a run; the next run reads it.
      responses:
        "202":
          description: The reset is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentMessage" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/continue:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    post:
      operationId: continueChat
      description: >
        Runs this writable session again on its current context, for example
        after a failed or stopped run. It sends no new message. A repeated
        UUID starts nothing new. When the context ends in a complete answer,
        the run ends at once and the timeline shows "Nothing to continue".
        409 while the session runs or when it never ran. Automation and
        channel sessions return 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: {
                  type: string,
                  description: A stable client UUID for this continue.,
                }
      responses:
        "202":
          description: The run started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentMessage" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/fork:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    post:
      operationId: forkChat
      description: >
        Starts a new Chat from the history of this writable session. Without
        before, the history ends at entryId, which must be an answer that
        waits for no tool result. With before, it ends just before entryId;
        when nothing comes before it, the new Chat is empty. The new Chat
        takes the model, thinking level and project of this session and does
        not run. A running session contributes only its committed entries.
        Files on disk are not rolled back. With environmentId (local or a
        registered environment ID), the new Chat runs in that environment. When that
        moves the Chat to another environment, it has no project, and its
        history ends with a notice that the user and the bot see. Files,
        background tasks, and queued input stay where they are. A new Chat
        with no history gets no notice. Without environmentId, the new Chat
        keeps the environment selection of this session. Without an id, each
        call creates another Chat. A retry with the same id and parameters
        returns the same Chat. A different source or parameters return 409.
        400 when the entry is not in this session or cannot start a fork, or
        when the environment does not exist or is not local or SSH. A scoped
        session with environmentId, and automation and channel sessions,
        return 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entryId]
              properties:
                id: {
                  type: string,
                  description: "Optional client UUID for safe retries.",
                }
                entryId: { type: integer, format: int64 }
                before:
                  type: boolean
                  description: End the history just before the entry.
                environmentId:
                  type: string
                  description: The execution environment of the new Chat.
      responses:
        "201":
          description: The new Chat.
          content:
            application/json:
              schema:
                type: object
                required: [chatId]
                properties:
                  chatId: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/compact:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    post:
      operationId: compactChat
      description: >
        Summarizes the older context of this writable session. It also works
        while the session runs; the summary joins the context at the next
        boundary. Session cancellation drops a summary that still waits. The timeline
        shows a pending, then a queued compaction boundary, then the summary,
        "nothing to compact", or the failure. Without an id each call starts
        a new compaction. A retry with the same id starts at most one
        compaction. Different instructions or chat return 409. 409 when the
        session never ran. Automation and
        channel sessions return 403.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id: {
                  type: string,
                  description: "Optional client UUID for safe retries.",
                }
                instructions:
                  type: string
                  maxLength: 32000
                  description: What the summary must keep.
      responses:
        "202": { description: The compaction started. }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/history:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    get:
      operationId: getChatHistory
      description: >
        Reads committed items before an entry ID, oldest first. Pages can
        overlap the live snapshot. Merge by item ID. The entry limit extends
        to an assistant or input boundary to keep tool results with their call.
        Notifications use a separate cursor and are newest first. Supply at
        least one cursor.
      parameters:
        - in: query
          name: before
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: beforeNotification
          schema: { type: string, minLength: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: A history page. An absent cursor means that source has no more entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryPage" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/items/{itemId}:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
      - in: path
        name: itemId
        required: true
        schema: { type: string }
    get:
      operationId: getChatItem
      description: >
        Reads one committed item with all of its tool output or thought. Use
        it for an item with truncated set.
      parameters:
        - in: query
          name: entry
          required: true
          description: The entryId of the item.
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: The full item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/abort:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    post:
      operationId: abortChat
      description: >
        On Main, Stop cancels only the native foreground task identified by runTarget.
        An ended or foreign target returns 409. Stop cannot cancel a successor task.
        It keeps queued input, child sessions, background commands and Monitors.
        On other writable sessions, omit runTarget to cancel the session. Session
        cancellation withdraws pending input and can stop child work. Processes
        and remote work may continue. Cancellation does not undo prior actions.
        Automation and channel sessions return 403.
      parameters:
        - in: query
          name: runTarget
          description: Required on Main. Use the native task target from the snapshot or run event. Omit for other sessions.
          schema: { type: string }
      responses:
        "200":
          description: Cancellation is requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/monitors:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    get:
      operationId: listChatMonitors
      description: Returns scheduled and recent follow-up monitors for this session.
      responses:
        "200":
          description: Follow-up monitors ordered with scheduled monitors first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorList" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/monitors/{monitorId}:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
      - in: path
        name: monitorId
        required: true
        schema: { type: string }
    delete:
      operationId: cancelChatMonitor
      description: Cancels a scheduled follow-up monitor of this session.
      responses:
        "200":
          description: The updated monitor record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Monitor" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/outbox:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    get:
      operationId: listChatOutbox
      description: Returns recent outbound messages and delivery states for this session.
      responses:
        "200":
          description: Recent outbox messages, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutboxMessageList" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/chats/{chatId}/events:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/ChatId"
    get:
      operationId: watchChat
      description: >
        Server-sent events. Each event has `event: <type>` and one `data:` line
        with a ChatEvent as JSON. The first event is a native snapshot. An
        eligible Web conversation also gets an initial notifications page and
        later notification updates. Merge notifications by Outbox ID; a native
        snapshot does not replace them. A comment line comes every 15 s. The
        server closes the stream when the agent reloads, the engine closes, or
        the client is too slow. The client reconnects and gets a new snapshot.
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/ChatEvent" }
        "404": { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/uploads:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    post:
      operationId: createUpload
      description: >
        Stores one file for a later message, in the agent workspace at
        `uploads/<id>/<name>`. The agent reads it with its tools. The largest
        file is 20 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/uploads/{uploadId}:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - name: uploadId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getUpload
      description: >
        The file of an upload. PNG, JPEG, GIF and WebP images come inline with
        their type; all other files come as a download of type
        application/octet-stream.
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/artifacts:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    get:
      operationId: listArtifacts
      description: Regular files in this bot’s artifacts directory.
      responses:
        "200":
          description: Current bot files.
          content:
            application/json:
              schema:
                type: object
                required: [artifacts]
                properties:
                  artifacts:
                    type: array
                    items: { $ref: "#/components/schemas/Artifact" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/artifacts/{artifactName}:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - in: path
        name: artifactName
        required: true
        schema: { type: string }
    get:
      operationId: getArtifact
      description: The current bot file bytes. Only safe raster images are inline.
      responses:
        "200":
          description: File bytes.
          headers:
            Content-Disposition:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

    patch:
      operationId: renameArtifact
      description: Rename a bot file. Existing names are conflicts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
      responses:
        "200":
          description: Renamed file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteArtifact
      description: Delete this bot file. Workspace source files are unchanged.
      responses:
        "200":
          description: File deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/extensions:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    get:
      operationId: getExtensions
      description: >
        The agent's skills and MCP servers. It does not start MCP servers.
        Before the agent starts, the servers are idle.
      responses:
        "200":
          description: The extensions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Extensions" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/extensions/mcp/{name}/oauth:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - in: path
        name: name
        required: true
        schema: { type: string }
    post:
      operationId: startMcpOAuth
      description: Start browser authorization for the effective MCP declaration at the given scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope: { $ref: "#/components/schemas/ExtensionScope" }
      responses:
        "200":
          description: The authorization URL and a browser binding cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [authorizationUrl]
                properties:
                  authorizationUrl: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/vault:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    get:
      operationId: listVault
      description: List vault metadata at dex and agent levels. Values are write-only.
      responses:
        "200":
          description: Vault entries without their values.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VaultEntry" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: putVault
      description: Set a vault value. The agent reloads when idle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, name, value]
              properties:
                scope: { $ref: "#/components/schemas/ExtensionScope" }
                name: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
                value: { type: string, writeOnly: true }
      responses:
        "200":
          description: Vault value saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteVault
      description: Remove a vault value. The agent reloads when idle.
      parameters:
        - in: query
          name: scope
          required: true
          schema: { $ref: "#/components/schemas/ExtensionScope" }
        - in: query
          name: name
          required: true
          schema: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
      responses:
        "200":
          description: Vault value removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/extensions/reload:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    post:
      operationId: reloadExtensions
      description: >
        Reloads only the selected agent's Harness and MCP connections. Opens
        that agent if needed and returns its server connection states. Skills
        need no reload. Checks idle execution across all agents before replacement;
        returns 409 when any agent has unfinished work. Other agents can start work
        after this check while the selected agent reloads. Returns 400 when a file
        is not valid and keeps the current resources. Returns 503 while model discovery is pending.
      responses:
        "200":
          description: The loaded extensions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Extensions" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/automations:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
    get:
      operationId: listAutomations
      description: All automations of this agent, oldest first.
      responses:
        "200":
          description: The automations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationList" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAutomation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/automations/targets:
    get:
      operationId: listAutomationTargets
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Existing sessions that can be used by a Routine of this bot.
          content:
            application/json:
              schema:
                type: object
                required: [targets]
                properties:
                  targets:
                    type: array
                    items: { $ref: "#/components/schemas/AutomationTarget" }
  /api/agents/{agentId}/automations/{automationId}:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/AutomationId"
    get:
      operationId: getAutomation
      responses:
        "200":
          description: The automation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateAutomation
      description: >
        Changes the automation. The next run is computed again from now, so a
        change never runs a past time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Automation" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAutomation
      description: Removes the automation and its run history. Its chats stay.
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/automations/{automationId}/run:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/AutomationId"
    post:
      operationId: runAutomation
      description: >
        Runs the automation now, outside its schedule. The run is skipped when
        the agent has no model or the previous run is still busy.
      responses:
        "202":
          description: The run, started or skipped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationRun" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/agents/{agentId}/automations/{automationId}/runs:
    parameters:
      - in: path
        name: agentId
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/AutomationId"
    get:
      operationId: listAutomationRuns
      description: The last 50 runs, newest first.
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationRunList" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    TaskKey:
      in: path
      name: taskKey
      required: true
      description: A Task key such as T-42, or the Task UUID.
      schema: { type: string }
    TaskRevision:
      in: header
      name: If-Match
      description: The expected Task revision as a decimal integer.
      schema: { type: integer, format: int64, minimum: 0 }
    AgentId:
      in: path
      name: agentId
      required: true
      schema: { type: string }
    AutomationId:
      name: automationId
      in: path
      required: true
      schema: { type: string }
    ChatId:
      name: chatId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    EnvironmentId:
      name: environmentId
      in: path
      required: true
      schema: { type: string }

  securitySchemes:
    TaskToken:
      type: http
      scheme: bearer
    bearer: { type: http, scheme: bearer }
    session: { type: apiKey, in: cookie, name: dex_session }

  responses:
    Error:
      description: The request failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    TaskLink:
      type: object
      description: >
        An external object linked to the Task, such as a GitHub PR. The source
        that owns the namespace gives the meaning of type and key.
      required: [namespace, type, key, waits]
      properties:
        namespace: { type: string }
        type: { type: string }
        key: { type: string }
        waits:
          type: array
          items: { $ref: "#/components/schemas/TaskWait" }
    TaskWait:
      type: object
      required: [id, event, revision, afterAt, resolved, alert]
      properties:
        id: { type: integer, format: int64 }
        event: {
          type: string,
          description: The event type that resolves the wait.,
        }
        revision: { type: string }
        afterAt: { type: integer, format: int64 }
        resolved: { type: boolean }
        alert:
          type: boolean
          description: Main gets a Task alert when the wait resolves.
    TaskStatus: {
      type: string,
      enum: [backlog, ready, in_progress, in_review, done, cancelled],
    }
    TaskReviewerKind: { type: string, enum: ["", owner, bot] }
    TaskList:
      type: object
      required: [tasks]
      properties:
        tasks: {
          type: array,
          items: { $ref: "#/components/schemas/TaskSummary" },
        }
    TaskSummary:
      type: object
      required: [
        id,
        key,
        number,
        title,
        status,
        assigneeBotId,
        reviewerKind,
        reviewerId,
        reviewSeq,
        revision,
        blocked,
        blockerCount,
        createdAt,
        updatedAt,
      ]
      properties:
        id: { type: string }
        key: { type: string }
        number: { type: integer, format: int64 }
        title: { type: string, minLength: 1, maxLength: 160 }
        status: { $ref: "#/components/schemas/TaskStatus" }
        assigneeBotId: { type: string }
        reviewerKind: { $ref: "#/components/schemas/TaskReviewerKind" }
        reviewerId: { type: string }
        reviewSeq: { type: integer, format: int64 }
        revision: { type: integer, format: int64 }
        blocked: { type: boolean }
        blockerCount: { type: integer, format: int64 }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        primarySession: { $ref: "#/components/schemas/TaskSession" }
    TaskSession:
      type: object
      required: [
        conversationId,
        agentId,
        agentName,
        title,
        isPrimary,
        linkedAt,
        state,
      ]
      properties:
        conversationId: { type: integer, format: int64 }
        agentId: { type: string }
        agentName: { type: string }
        title: { type: string }
        isPrimary: { type: boolean }
        linkedAt: { type: integer, format: int64 }
        state: {
          type: string,
          enum: [
            dispatched,
            running,
            idle,
            completed,
            failed,
            stale,
            cancelled,
          ],
        }
        endedAt: { type: integer, format: int64 }
    TaskCreate:
      type: object
      required: [assigneeBotId, title]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        status: { type: string, enum: [backlog, ready, in_progress] }
        assigneeBotId: { type: string }
        reviewerKind: { $ref: "#/components/schemas/TaskReviewerKind" }
        reviewerId: { type: string }
        note: { type: string, maxLength: 32000 }
    TaskUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        status: { $ref: "#/components/schemas/TaskStatus" }
        assigneeBotId: { type: string }
        reviewerKind: { $ref: "#/components/schemas/TaskReviewerKind" }
        reviewerId: { type: string }
    TaskEntryCreate:
      type: object
      required: [content]
      properties:
        kind: { type: string, enum: [note, artifact] }
        tag: { type: string, enum: [brief, decision, handoff, update] }
        content: { type: string, maxLength: 32000 }
    TaskReview:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, request_changes] }
        reviewSeq: { type: integer, format: int64 }
        note: { type: string, maxLength: 32000 }
    TaskSplit:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        assigneeBotId: { type: string }
        note: { type: string, maxLength: 32000 }
        status: { type: string, enum: [backlog, ready, in_progress] }
        reviewer: { type: string, enum: [none, owner, creator] }
        dependsOn: { type: array, items: { type: string } }
    TaskDependencyCreate:
      type: object
      required: [dependsOn]
      properties:
        dependsOn: { type: string, minLength: 1 }
    TaskRef:
      type: object
      required: [key, title, status, assigneeBotId]
      properties:
        key: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        assigneeBotId: { type: string }
    TaskExecutionAttach:
      type: object
      properties:
        harness: { type: string, enum: [claude-code, codex, opencode, custom] }
        machineId: { type: string }
        hostMeta: { $ref: "#/components/schemas/TaskExecutionHost" }
        workspacePath: { type: string }
        gitBranch: { type: string }
        externalSessionId: { type: string }
        leaseSeconds: {
          type: integer,
          format: int64,
          minimum: 1,
          maximum: 3600,
        }
    TaskExecutionHost:
      type: object
      properties:
        hostname: { type: string }
    TaskExecutionHeartbeat:
      type: object
      properties:
        gitBranch: { type: string }
        externalSessionId: { type: string }
        leaseSeconds: {
          type: integer,
          format: int64,
          minimum: 1,
          maximum: 3600,
        }
    TaskExecutionFinish:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [completed, failed] }
        summary: { type: string, maxLength: 32000 }
    TaskExecution:
      type: object
      required: [id, botId, kind, state, leaseEpoch, startedAt]
      properties:
        id: { type: string }
        taskKey: { type: string }
        botId: { type: string }
        kind: { type: string, enum: [dex_session, external_agent] }
        state: {
          type: string,
          enum: [
            dispatched,
            running,
            idle,
            completed,
            failed,
            stale,
            cancelled,
          ],
        }
        harness: { type: string }
        machineId: { type: string }
        runnerName: { type: string }
        hostname: { type: string }
        workspacePath: { type: string }
        gitBranch: { type: string }
        externalSessionId: { type: string }
        dispatchId: { type: string }
        leaseEpoch: { type: integer, format: int64 }
        leaseExpiresAt: { type: integer, format: int64 }
        lastHeartbeatAt: { type: integer, format: int64 }
        startedAt: { type: integer, format: int64 }
        endedAt: { type: integer, format: int64 }
    TaskTokenIssue:
      type: object
      required: [execution, taskToken]
      properties:
        execution: { $ref: "#/components/schemas/TaskExecution" }
        taskToken: { type: string }
    TaskExecutionList:
      type: object
      required: [executions]
      properties:
        executions: {
          type: array,
          items: { $ref: "#/components/schemas/TaskExecution" },
        }
    TaskExternalTask:
      type: object
      required: [task, entries, nextAfterSeq]
      properties:
        task: { $ref: "#/components/schemas/TaskRef" }
        entries: {
          type: array,
          items: { $ref: "#/components/schemas/TaskEntry" },
        }
        nextAfterSeq: { type: integer, format: int64 }
    TaskDetail:
      type: object
      required: [
        task,
        entries,
        sessions,
        blockers,
        questions,
        links,
        canSplit,
        subtasks,
        dependencies,
      ]
      properties:
        task: { $ref: "#/components/schemas/TaskSummary" }
        canSplit: { type: boolean }
        parentTask: { $ref: "#/components/schemas/TaskRef" }
        subtasks:
          type: array
          items: { $ref: "#/components/schemas/TaskRef" }
        dependencies:
          type: array
          items: { $ref: "#/components/schemas/TaskRef" }
        entries: {
          type: array,
          items: { $ref: "#/components/schemas/TaskEntry" },
        }
        sessions: {
          type: array,
          items: { $ref: "#/components/schemas/TaskSession" },
        }
        blockers: {
          type: array,
          items: { $ref: "#/components/schemas/TaskBlocker" },
        }
        questions: {
          type: array,
          items: { $ref: "#/components/schemas/TaskQuestion" },
        }
        links: {
          type: array,
          items: { $ref: "#/components/schemas/TaskLink" },
        }
    TaskEntry:
      type: object
      required: [
        id,
        seq,
        kind,
        tag,
        actorKind,
        actorBotId,
        trust,
        content,
        createdAt,
      ]
      properties:
        id: { type: integer, format: int64 }
        seq: { type: integer, format: int64 }
        kind: {
          type: string,
          enum: [note, artifact, status, assign, review, execution, external],
        }
        tag: { type: string }
        actorKind: { type: string }
        actorBotId: { type: string }
        trust: { type: string, enum: [owner, agent, external] }
        content: { type: string }
        createdAt: { type: integer, format: int64 }
        eventId: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        decision: { type: string, enum: [approve, request_changes] }
    TaskBlocker:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [wait, question, dependency] }
        taskKey: { type: string }
        waitId: { type: integer, format: int64 }
        namespace: { type: string }
        objectType: { type: string }
        objectKey: { type: string }
        eventType: { type: string }
        questionId: { type: string }
        question: { type: string }
        queuePosition: { type: integer, format: int64 }
    TaskQuestion:
      type: object
      required: [id, text, options, queued, agentId, conversationId]
      properties:
        id: { type: string }
        text: { type: string }
        options: { type: array, items: { type: string } }
        queued: { type: boolean }
        agentId: { type: string }
        conversationId: { type: integer, format: int64 }
    TaskEvent:
      type: object
      required: [taskId]
      properties:
        taskId: { type: string }

    HeldEvent:
      type: object
      required: [
        id,
        namespace,
        eventType,
        objects,
        reason,
        content,
        sourceUrl,
        authorLogin,
        authorAssociation,
        occurredAt,
        heldAt,
      ]
      properties:
        id: { type: string }
        namespace: { type: string }
        eventType: { type: string }
        objects:
          type: array
          items:
            type: object
            required: [type, key]
            properties:
              type: { type: string }
              key: { type: string }
        reason:
          type: string
          enum: [unmatched, conflict]
          description: Unmatched means no Task links an object. Conflict means the objects link to different Tasks.
        content:
          type: string
          description: The event text from the source. Show it to the owner only.
        sourceUrl: { type: string }
        authorLogin: { type: string }
        authorAssociation: { type: string }
        occurredAt: { type: integer, format: int64 }
        heldAt: { type: integer, format: int64 }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: A message for the user. }

    NewSession:
      type: object
      required: [token]
      properties:
        token: {
          type: string,
          description: The access token. `dex token` prints the stored token.,
        }

    Ok:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }

    PluginSetting:
      type: object
      required: [name, enabled, running]
      properties:
        name: { type: string }
        enabled: {
          type: boolean,
          description: The stored choice. dex reads it at start.,
        }
        running: {
          type: boolean,
          description: The plugin runs in this process.,
        }
        error: {
          type: string,
          description: Why an enabled plugin does not run,
          for example a failed migration.,
        }
    Health:
      type: object
      required: [status, version, startedAt, dataDir, runtimeReady, plugins]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
        startedAt: { type: integer, format: int64 }
        dataDir: { type: string }
        runtimeReady: { type: boolean }
        plugins:
          type: array
          description: The names of the enabled plugins, for example github.
          items: { type: string }

    SystemUpdateChannel:
      type: string
      enum: [stable, prerelease]

    SystemCapability:
      type: object
      required: [supported, canRestart]
      properties:
        supported: { type: boolean }
        reason: { type: string }
        canRestart: { type: boolean }

    SystemRelease:
      type: object
      required: [tag, prerelease]
      properties:
        tag: { type: string }
        prerelease: { type: boolean }
        publishedAt: { type: string }
        notes: { type: string }
        url: { type: string }

    SystemBackup:
      type: object
      required: [name, sizeBytes, createdAt]
      properties:
        name: { type: string }
        sizeBytes: { type: integer, format: int64 }
        createdAt: { type: integer, format: int64 }

    SystemLogEntry:
      type: object
      required: [seq, time, level, message]
      properties:
        seq: { type: integer, format: int64 }
        time: { type: integer, format: int64 }
        level: { type: string }
        message: { type: string }
        attrs: { type: string }

    SystemLogs:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/SystemLogEntry" }

    SystemStatus:
      type: object
      required:
        [
          version,
          startedAt,
          state,
          updateChannel,
          capability,
          updateAvailable,
          backups,
        ]
      properties:
        version: { type: string }
        startedAt: { type: integer, format: int64 }
        state:
          type: string
          enum: [idle, checking, downloading, waiting_idle, restarting, error]
        pendingAction:
          type: string
          enum: [restart, upgrade]
        targetVersion: { type: string }
        downloadDone: { type: integer, format: int64 }
        downloadTotal: { type: integer, format: int64 }
        updateChannel: { $ref: "#/components/schemas/SystemUpdateChannel" }
        capability: { $ref: "#/components/schemas/SystemCapability" }
        latest: { $ref: "#/components/schemas/SystemRelease" }
        updateAvailable: { type: boolean }
        lastCheckedAt: { type: integer, format: int64 }
        lastError: { type: string }
        backups:
          type: array
          items: { $ref: "#/components/schemas/SystemBackup" }

    AgentEnvironments:
      type: object
      required: [environments]
      properties:
        environments:
          type: array
          items:
            type: object
            x-go-type: engine.EnvironmentInfo
            x-go-type-import:
              path: github.com/recally-io/dex/internal/engine
            required: [id, name, kind, default, status]
            properties:
              id: { type: string }
              name: { type: string }
              desc: {
                type: string,
                maxLength: 500,
                description: Owner-provided plain text.,
              }
              kind: { type: string }
              default: {
                type: boolean,
                description: This is the environment of the agent.,
              }
              status:
                type: string
                description: "available, offline, or unavailable: <reason>."
    Chat:
      type: object
      required: [
        id,
        channel,
        title,
        createdAt,
        updatedAt,
        busy,
        settings,
        main,
        readOnly,
        cwd,
      ]
      properties:
        id: { type: integer, format: int64 }
        channel:
          type: string
          enum: [web, telegram, wechat, feishu, automation]
          description: External channel chats are read-only in the web UI.
        main: { type: boolean, description: This is the agent's main timeline. }
        readOnly: {
          type: boolean,
          description: The web cannot send messages to this chat now. A child session is writable at any time.,
        }
        automationId:
          type: string
          description: The automation that created the chat.
        cwd:
          type: string
          description: The saved project directory. Empty means the workspace of the environment.
        environmentId:
          type: string
          description: >-
            The execution environment that the chat selects: "local" or an environment ID. Empty
            means the environment of the agent.
        title: { type: string }
        createdAt: { type: integer, format: int64 }
        updatedAt:
          type: integer
          format: int64
          description: >-
            Latest activity time, in Unix milliseconds. Includes conversation
            creation, and input creation and settlement.
        busy:
          type: boolean
          description: True while a message of the chat has no answer yet.
        archivedAt:
          type: integer
          format: int64
          description: >-
            When the user archived this Chat session, in Unix milliseconds.
            Absent when the session is not archived.
        settings: { $ref: "#/components/schemas/ChatSettings" }
        question: { $ref: "#/components/schemas/ChatQuestion" }
        forkedFrom: { $ref: "#/components/schemas/ChatOrigin" }
        parentId:
          type: integer
          format: int64
          description: The session that created this child session. Absent on any other session.
        agentId:
          type: string
          description: >-
            The bot that owns this session. Only on a child session that belongs to
            another bot than the one in the request path. The list of the parent shows it.
        agentName:
          type: string
          description: The name of the bot in agentId. Present with agentId.
        parentAgentId:
          type: string
          description: >-
            The bot of the parent session. Only on a child session whose parent belongs to
            another bot than the one in the request path.
        parentAgentName:
          type: string
          description: The name of the bot in parentAgentId. Present with parentAgentId.
        lastActivityAt:
          type: integer
          format: int64
          description: The latest engine observation of activity. Only the session list sets it, and only while the session is busy.
        toolStartedAt:
          type: integer
          format: int64
          description: The earliest start of a tool that runs now. Only the session list sets it, and only while the session is busy and runs a tool.
        stoppedWithParent:
          type: boolean
          description: True when a cascading Stop on the parent would act on this child. Web Stop on Main does not cascade. Only the session list sets it.

    ChatOrigin:
      type: object
      description: The session that a Chat was forked from. Only on a single chat.
      required: [id, title, main]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        main: { type: boolean }

    ChatSettings:
      x-go-type: chat.Settings
      x-go-type-import:
        path: github.com/recally-io/dex/internal/chat
      type: object
      description: >
        The settings that a chat overrides. An absent field follows the
        agent's setting. provider and modelId are both present or both absent.
      properties:
        provider: { type: string }
        modelId: { type: string }
        thinkingLevel: { $ref: "#/components/schemas/ThinkingLevel" }

    ChatList:
      type: object
      required: [chats]
      properties:
        chats:
          type: array
          items: { $ref: "#/components/schemas/Chat" }

    MessageInput:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
          description: A new UUID from the client. A retried request uses the same ID.
        text:
          type: string
          maxLength: 32000
          description: >
            1 to 32000 characters. It can be empty when the message has an
            attachment.
        attachments:
          type: array
          maxItems: 10
          description: Upload IDs from POST /api/agents/{agentId}/uploads, at most 10.
          items: { type: string }
        taskId:
          type: string
          description: Selects a Task for a Main message by key (for example, T-42) or UUID.
        answersQuestionId:
          type: string
          description: >
            The ID of the open question that this message answers. dex answers
            409 when the question is closed. A message without this field
            never closes a question.
        mode:
          type: string
          enum: [followUp, steer, reject]
          default: followUp
          description: >
            What happens when the agent is already working in this chat.
            followUp waits until the current run ends. steer joins the current
            run after its current tool step. reject answers 409 and the message
            does not run. A retry must use the same mode. An omitted mode
            is equal to followUp.
            When dex cannot admit a reject message at once, it answers 202 and
            admits it later; the message then runs only if the chat is idle.

    ChatQuestion:
      type: object
      required: [id, text, options, status]
      description: >
        The question that the agent asked with ask_user. It waits for the user,
        or its answer waits in the queue.
      properties:
        id: { type: string }
        text: { type: string }
        options:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [open, answered]
          description: >
            open waits for an answer. answered means the answer is saved and
            runs after the current reply.
        answer:
          type: string
          description: The text of the answer. Present when the status is answered.
        action:
          type: string
          enum: [archive]
          description: >
            Present when control acts on the answer. The question asks the owner
            to approve this action, and only the first option approves.
        outcome:
          type: string
          description: What control decided for the answer. Present for an answered action question.

    WithdrawnMessage:
      type: object
      required: [id, text, attachments]
      properties:
        id: { type: string }
        text: { type: string }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }

    Artifact:
      type: object
      required: [name, size, modifiedAt]
      properties:
        name: { type: string }
        size: { type: integer, format: int64 }
        modifiedAt: { type: string }
    Attachment:
      x-go-type: engine.Attachment
      x-go-type-import:
        path: github.com/recally-io/dex/internal/engine
      type: object
      required: [id, name, size, mimeType, path]
      properties:
        id: { type: string }
        name: { type: string }
        size: { type: integer, format: int64, description: Bytes. }
        mimeType: { type: string }
        path:
          type: string
          description: The path in the agent workspace, uploads/<id>/<name>.

    SentMessage:
      type: object
      required: [submissionId]
      properties:
        submissionId: { type: string }

    # Automations

    Schedule:
      x-go-type: automation.Schedule
      x-go-type-import:
        path: github.com/recally-io/dex/internal/automation
      type: object
      required: [kind]
      description: >
        every: each `minutes` minutes. daily: each day at `time`. weekly: at
        `time` on `days`. once: at `at`. Times are in the automation's time
        zone.
      properties:
        kind: { type: string, enum: [every, daily, weekly, once] }
        minutes: { type: integer, minimum: 5, maximum: 10080 }
        time: { type: string, description: "HH:MM, 24 h", example: "09:00" }
        days:
          type: array
          description: ISO weekdays, 1 is Monday.
          items: { type: integer, minimum: 1, maximum: 7 }
        at: { type: integer, format: int64 }

    ScheduleInput:
      type: object
      required: [schedule, timeZone]
      properties:
        schedule: { $ref: "#/components/schemas/Schedule" }
        timeZone: {
          type: string,
          description: An IANA time zone,
          such as Asia/Shanghai.,
        }

    SchedulePreview:
      type: object
      required: [nextRuns]
      properties:
        nextRuns:
          type: array
          description: At most 3 times; empty when the schedule has no future time.
          items: { type: integer, format: int64 }

    NotificationTargets:
      x-go-type: agent.NotificationTargets
      x-go-type-import:
        path: github.com/recally-io/dex/internal/agent
      type: object
      required: [targets, primaryId]
      properties:
        primaryId: { type: string }
        targets:
          type: array
          items:
            type: object
            required: [id, platform, peer]
            properties:
              id: { type: string }
              platform: { type: string, enum: [telegram, feishu, wechat] }
              peer: { type: string }

    AutomationTarget:
      type: object
      required: [id, title, main]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        main: { type: boolean }

    AutomationInput:
      x-go-type: automation.Input
      x-go-type-import:
        path: github.com/recally-io/dex/internal/automation
      type: object
      required: [name, prompt, schedule, timeZone, session, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        prompt: { type: string, minLength: 1, maxLength: 32000 }
        cwd:
          type: string
          description: Existing absolute project directory. Empty uses the agent workspace.
        schedule: { $ref: "#/components/schemas/Schedule" }
        timeZone: { type: string }
        session:
          type: string
          enum: [new, reuse, session]
          description: >-
            New starts a new chat each run. Reuse uses one dedicated chat.
            Session sends a follow-up to an existing chat and uses its environment and directory.
        targetConversationId:
          type: integer
          format: int64
          minimum: 1
          description: Required in session mode. Absent if the saved target was deleted.
        enabled: { type: boolean }
        environmentId:
          type: string
          description: >
            local or an SSH environment ID for the runs. Empty follows the
            bot's environment. A run never uses another environment: when
            this one was removed, the run is skipped with a reason. A reused
            chat that ran in another environment stays readable, and the
            run starts a new chat. An update can keep a removed environment.
        notification:
          type: object
          description: Omit on update to retain the current route. New routines default to none.
          required: [mode]
          properties:
            mode: { type: string, enum: [none, default, target] }
            targetId: {
              type: string,
              description: An authorized target owned by this agent.,
            }

    Automation:
      x-go-type: automation.Automation
      x-go-type-import:
        path: github.com/recally-io/dex/internal/automation
      allOf:
        - $ref: "#/components/schemas/AutomationInput"
        - type: object
          required: [id, nextRuns, createdAt, updatedAt]
          properties:
            id: { type: string }
            nextRuns:
              type: array
              description: At most 3 times; empty when disabled or done.
              items: { type: integer, format: int64 }
            lastRun: { $ref: "#/components/schemas/AutomationRun" }
            createdAt: { type: integer, format: int64 }
            updatedAt: { type: integer, format: int64 }

    InboxSummary:
      type: object
      required: [sessions, automations, inbox, taskReviews]
      properties:
        taskReviews:
          type: array
          items: { $ref: "#/components/schemas/TaskRef" }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/InboxSummarySession" }
        automations:
          type: array
          items: { $ref: "#/components/schemas/InboxSummaryAutomation" }
        inbox:
          type: array
          items: { $ref: "#/components/schemas/InboxItem" }
    InboxSummarySession:
      type: object
      required: [agentId, chat]
      properties:
        agentId: { type: string }
        chat: { $ref: "#/components/schemas/Chat" }
    InboxSummaryAutomation:
      type: object
      required: [agentId, automation, setup]
      properties:
        agentId: { type: string }
        automation: { $ref: "#/components/schemas/Automation" }
        setup: { type: boolean }
    AutomationList:
      type: object
      required: [automations]
      properties:
        automations:
          type: array
          items: { $ref: "#/components/schemas/Automation" }

    InboxItem:
      x-go-type: automation.InboxItem
      x-go-type-import:
        path: github.com/recally-io/dex/internal/automation
      type: object
      required: [
        runId,
        agentId,
        agentName,
        automationId,
        automationName,
        chatId,
        outcome,
        summary,
        createdAt,
        read,
        dismissed,
        environmentId,
        cwd,
      ]
      properties:
        runId: { type: string }
        agentId: { type: string }
        agentName: { type: string }
        automationId: { type: string }
        automationName: { type: string }
        summary: { type: string }
        chatId: { type: integer, format: int64 }
        createdAt: { type: integer, format: int64 }
        outcome: { type: string, enum: [changed, failed] }
        read: { type: boolean }
        dismissed: { type: boolean }
        environmentId:
          type: string
          description: The effective execution environment that the run started in. Empty for a run with no message, and for a run from before Dex stored it.
        cwd:
          type: string
          description: The cwd that the run started with, in its environment.

    AutomationRun:
      x-go-type: automation.Run
      x-go-type-import:
        path: github.com/recally-io/dex/internal/automation
      type: object
      required: [id, status, createdAt, outcome, summary, duplicate]
      properties:
        id: { type: string }
        dueAt:
          type: integer
          format: int64
          description: The scheduled time; absent for a run that the user started.
        createdAt: { type: integer, format: int64 }
        admittedAt:
          type: integer
          format: int64
          description: Input admission time, not necessarily execution start.
        settledAt: { type: integer, format: int64 }
        status: { type: string, enum: [running, done, failed, skipped] }
        outcome:
          type: string
          enum: ["", changed, unchanged, failed]
          description: Empty before a report or for a skipped run. Terminal runs require a report or fail.
        summary: { type: string }
        changeKey: { type: string }
        duplicate:
          type: boolean
          description: An earlier completed report has the same change key. Actions are not suppressed.
        reason: { type: string }
        notificationNote:
          type: string
          description: Why Dex could not queue a notification for this run, if applicable.
        chatId: { type: integer, format: int64 }
        environmentId:
          type: string
          description: The effective execution environment that the run started in. Empty for a run with no message, and for a run from before Dex stored it.
        cwd:
          type: string
          description: The cwd that the run started with, in its environment.

    AutomationRunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/AutomationRun" }

    # Transcript

    HistoryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        nextBefore: { type: integer, format: int64 }
        notifications:
          type: array
          items: { $ref: "#/components/schemas/TimelineNotification" }
        nextBeforeNotification: { type: string }

    TimelineNotification:
      type: object
      description: A Web-origin notification read from the Outbox. It is not a delivery receipt.
      required: [id, text, at]
      properties:
        id: { type: string, description: Outbox ID. }
        text: { type: string }
        at: {
          type: integer,
          format: int64,
          description: Creation time in milliseconds.,
        }

    BoundaryItem:
      type: object
      required: [kind, id, boundary]
      properties:
        kind: { type: string, enum: [boundary] }
        id: { type: string }
        entryId: { type: integer, format: int64 }
        boundary: { type: string, enum: [reset, compaction, environment] }
        at: {
          type: integer,
          format: int64,
          description: The boundary time in milliseconds.,
        }
        text:
          type: string
          description: >
            The handoff of a reset, the summary of a compaction, or the
            notice of a fork to another environment. Absent when there is
            none.
        status:
          type: string
          enum: [pending, queued, nothing, failed]
          description: >
            Only on compaction. pending while the summary is made; queued when
            the summary waits for the run's next boundary (session cancellation drops it);
            nothing when there was nothing to compact;
            failed with a reason. Absent on a placed summary.
        reason: { type: string, description: Why the compaction failed. }

    Item:
      oneOf:
        - $ref: "#/components/schemas/UserItem"
        - $ref: "#/components/schemas/TaskItem"
        - $ref: "#/components/schemas/ThinkingItem"
        - $ref: "#/components/schemas/ToolItem"
        - $ref: "#/components/schemas/AssistantItem"
        - $ref: "#/components/schemas/ErrorItem"
        - $ref: "#/components/schemas/BoundaryItem"
      discriminator:
        propertyName: kind
        mapping:
          user: "#/components/schemas/UserItem"
          task: "#/components/schemas/TaskItem"
          thinking: "#/components/schemas/ThinkingItem"
          tool: "#/components/schemas/ToolItem"
          assistant: "#/components/schemas/AssistantItem"
          error: "#/components/schemas/ErrorItem"
          boundary: "#/components/schemas/BoundaryItem"

    UserItem:
      type: object
      required: [kind, id, text]
      properties:
        kind: { type: string, enum: [user] }
        id: { type: string }
        origin:
          type: string
          description: The input entry, such as web, telegram:7, wechat:owner or feishu:owner.
        entryId: { type: integer, format: int64 }
        text: { type: string }
        at: { type: integer, format: int64 }
        queued:
          type: boolean
          description: True while the message waits for the agent.
        steer:
          type: boolean
          description: >
            True for a queued message that joins the current run after its
            current tool step. Other queued messages wait until the run ends.
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }

    TaskItem:
      type: object
      description: >-
        Marks the result of a child session turn. Items after this mark belong to the result
        until the next user or task item. The mark does not confirm that the
        work reached its goal.
      required: [kind, id, title, taskId]
      properties:
        kind: { type: string, enum: [task] }
        id: { type: string }
        entryId: { type: integer, format: int64 }
        at: { type: integer, format: int64 }
        title: { type: string }
        status:
          type: string
          description: The outcome of the child session turn. The answer stays in the child session.
        reason:
          type: string
          description: The reason the child session turn failed or was interrupted.

        taskId:
          type: string
          description: The input ID of the child session turn, or the ID of an old task.
        childSessionId:
          type: integer
          format: int64
          description: The child Session ID, when the saved result includes it.
        alert:
          type: boolean
          description: >-
            True for a Task alert on Main. The title is the Task title, and taskId is empty. The
            alert has only event metadata.

    ThinkingItem:
      type: object
      required: [kind, id, text]
      properties:
        kind: { type: string, enum: [thinking] }
        id: { type: string }
        entryId: { type: integer, format: int64 }
        text:
          type: string
          description: Empty when the provider redacted it.
        truncated:
          type: boolean
          description: >
            True when text holds only the first line of a long thought.
            getChatItem returns all of it.

    ToolItem:
      type: object
      required: [kind, id, name, args, output, status]
      properties:
        kind: { type: string, enum: [tool] }
        id: { type: string, description: The tool call ID. }
        entryId: { type: integer, format: int64 }
        name: { type: string }
        args:
          type: object
          additionalProperties: true
        output: { type: string }
        truncated:
          type: boolean
          description: >
            True when output is empty because it is long. getChatItem
            returns it.
        status:
          type: string
          enum: [running, done, error]
          description: A call that ended without a result is an error.
        durationMs: { type: integer, format: int64 }

    AssistantItem:
      type: object
      required: [kind, id, text]
      properties:
        kind: { type: string, enum: [assistant] }
        id: { type: string }
        entryId: { type: integer, format: int64 }
        text: { type: string, description: Markdown. }
        model: { type: string, description: "<provider>/<model id>" }
        usage: { $ref: "#/components/schemas/Usage" }

    ErrorItem:
      type: object
      required: [kind, id, reason]
      properties:
        kind: { type: string, enum: [error] }
        id: { type: string }
        entryId: { type: integer, format: int64 }
        reason: { type: string }
        aborted:
          type: boolean
          description: True when the user stopped the run.
        failure:
          type: string
          description: >
            The reason of the newest failed run, on the error item that ends
            it, such as aborted, model_error, no_model or nothing_to_answer.
            POST .../continue runs such a run again, except for
            nothing_to_answer.

    Usage:
      type: object
      required: [input, output]
      properties:
        input: { type: integer }
        output: { type: integer }

    Retry:
      type: object
      required: [attempt, at, reason]
      properties:
        attempt: { type: integer }
        at:
          type: integer
          format: int64
          description: Time of the next attempt.
        reason: { type: string }

    # Events

    ChatEvent:
      oneOf:
        - $ref: "#/components/schemas/SnapshotEvent"
        - $ref: "#/components/schemas/ItemEvent"
        - $ref: "#/components/schemas/AppendEvent"
        - $ref: "#/components/schemas/RunEvent"
        - $ref: "#/components/schemas/ChildEvent"
        - $ref: "#/components/schemas/NotificationsEvent"
      discriminator:
        propertyName: type
        mapping:
          snapshot: "#/components/schemas/SnapshotEvent"
          item: "#/components/schemas/ItemEvent"
          append: "#/components/schemas/AppendEvent"
          run: "#/components/schemas/RunEvent"
          child: "#/components/schemas/ChildEvent"
          notifications: "#/components/schemas/NotificationsEvent"

    NotificationsEvent:
      type: object
      required: [type, notifications, initial]
      properties:
        type: { type: string, enum: [notifications] }
        notifications:
          type: array
          description: Newest first. Merge by Outbox ID.
          items: { $ref: "#/components/schemas/TimelineNotification" }
        initial: {
          type: boolean,
          description: True for the first notification page of a connection.,
        }
        nextBeforeNotification: { type: string }

    ChildEvent:
      type: object
      description: >-
        Current state of this chat or an observed child. Idle is not a turn outcome.
        A disconnected client must show unavailable until the new stream supplies this state.
      required: [type, chatId, agentId, state]
      properties:
        type: { type: string, enum: [child] }
        chatId: { type: integer, format: int64 }
        agentId: { type: string }
        state: { type: string, enum: [waiting, running, idle, unavailable] }

    SnapshotEvent:
      type: object
      required: [type, items, running]
      properties:
        type: { type: string, enum: [snapshot] }
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        running: { type: boolean }
        runTarget: { $ref: "#/components/schemas/RunTarget" }
        historyBefore: {
          type: integer,
          format: int64,
          description: Load history before this entry ID.,
        }
        retry: { $ref: "#/components/schemas/Retry" }

    ItemEvent:
      type: object
      required: [type, item]
      description: Adds the item, or replaces the item with the same ID.
      properties:
        type: { type: string, enum: [item] }
        item: { $ref: "#/components/schemas/Item" }

    AppendEvent:
      type: object
      required: [type, id, text]
      description: Appends text to the text of the item with this ID.
      properties:
        type: { type: string, enum: [append] }
        id: { type: string }
        text: { type: string }

    RunEvent:
      type: object
      required: [type, running]
      properties:
        type: { type: string, enum: [run] }
        running: { type: boolean }
        runTarget: { $ref: "#/components/schemas/RunTarget" }
        retry: { $ref: "#/components/schemas/Retry" }

    RunTarget:
      type: string
      description: The exact foreground task of this session. Absent when no task can be stopped.

    # Settings

    Settings:
      type: object
      required: [providers, builtins, apis]
      properties:
        providers:
          type: array
          description: The providers that the user added, in the order of addition.
          items: { $ref: "#/components/schemas/Provider" }
        builtins:
          type: array
          description: All pi-ai built-in providers that take an API key.
          items: { $ref: "#/components/schemas/ProviderInfo" }
        apis:
          type: object
          description: The APIs of custom providers, ID → name.
          additionalProperties: { type: string }

    OnePasswordMode:
      type: string
      enum: [off, connect, service-account]

    OnePassword:
      type: object
      required: [
        mode,
        connectHost,
        connectTokenSet,
        serviceAccountTokenSet,
        cli,
      ]
      properties:
        mode: { $ref: "#/components/schemas/OnePasswordMode" }
        connectHost: { type: string }
        connectTokenSet: { type: boolean }
        serviceAccountTokenSet: { type: boolean }
        cli:
          type: string
          description: The path of op in the PATH of the tool environment, or empty.

    OnePasswordInput:
      type: object
      required: [mode]
      properties:
        mode: { $ref: "#/components/schemas/OnePasswordMode" }
        connectHost: { type: string }
        connectToken: { type: string }
        serviceAccountToken: { type: string }

    EnvironmentKind:
      type: string
      enum: [pi-env, e2b, runner]

    EnvironmentConfig:
      type: object
      properties:
        host: { type: string }
        user: { type: string }
        port: { type: integer }
        identityFile: { type: string }
        loginShell:
          type: boolean
          description: Starts the remote SSH runtime and captures environment variables through the user's login shell ($SHELL -l). Defaults to true when omitted.
        workspaceDir: { type: string }
        apiUrl: { type: string }
        domain: { type: string }
        envdUrl: { type: string }
        template: { type: string }
        timeoutSeconds: { type: integer }
        autoPause: { type: boolean }

    RunnerStatus:
      type: object
      required: [online]
      properties:
        online: { type: boolean }
        os: { type: string }
        arch: { type: string }
        version: { type: string }
        canSelfUpdate: { type: boolean }
        selfUpdateReason: { type: string }

    Environment:
      type: object
      required: [id, name, kind, config, secretSet, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        desc: {
          type: string,
          maxLength: 500,
          x-go-name: Description,
          description: Owner-provided plain text.,
        }
        kind: { $ref: "#/components/schemas/EnvironmentKind" }
        config: { $ref: "#/components/schemas/EnvironmentConfig" }
        secretSet: { type: boolean }
        runner: { $ref: "#/components/schemas/RunnerStatus" }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }

    EnvironmentList:
      type: object
      required: [environments]
      properties:
        environments:
          type: array
          items: { $ref: "#/components/schemas/Environment" }

    EnvironmentInput:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        desc:
          type: string
          maxLength: 500
          x-go-name: Description
          description: Optional plain text. Omit on update to keep the saved description. Send an empty string to clear it.
        kind: { $ref: "#/components/schemas/EnvironmentKind" }
        config: { $ref: "#/components/schemas/EnvironmentConfig" }
        secret:
          type: string
          description: Write-only secret. Required for E2B Cloud; optional for custom E2B endpoints. Empty or omitted on update keeps the saved secret.

    EnvironmentProbeInput:
      type: object
      required: [kind]
      properties:
        environmentId:
          type: string
          description: Optional existing environment ID when testing unsaved edits (reuses saved secret and known host key when host and port are unchanged).
        kind: { $ref: "#/components/schemas/EnvironmentKind" }
        config: { $ref: "#/components/schemas/EnvironmentConfig" }
        secret:
          type: string
          description: Optional write-only secret. When environmentId is set and secret is omitted or empty, uses the saved secret.

    EnvironmentTestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        platform: { type: string }
        arch: { type: string }
        home: { type: string }
        warnings:
          type: array
          items: { type: string }
        hostKeyChanged: { type: boolean }
        error: { type: string }

    SshHostEntry:
      type: object
      required: [alias]
      properties:
        alias: { type: string }
        hostName: { type: string }
        user: { type: string }
        port: { type: integer }
        identityFile: { type: string }
        proxyJump: { type: string }
        source: { type: string }

    SshConfigDiscovery:
      type: object
      required: [hosts, identityFiles]
      properties:
        hosts:
          type: array
          items: { $ref: "#/components/schemas/SshHostEntry" }
        identityFiles:
          type: array
          items: { type: string }

    Channels:
      x-go-type: agent.Channels
      x-go-type-import:
        path: github.com/recally-io/dex/internal/agent
      type: object
      required: [telegram, wechat, feishu]
      properties:
        telegram: { $ref: "#/components/schemas/Telegram" }
        wechat: { $ref: "#/components/schemas/Wechat" }
        feishu: { $ref: "#/components/schemas/Feishu" }

    AgentActivity:
      x-go-type: agent.Activity
      x-go-type-import:
        path: github.com/recally-io/dex/internal/agent
      type: object
      required: [
        routineFailed,
        activeSessions,
        runningChannels,
        enabledAutomations,
      ]
      properties:
        routineFailed: { type: boolean }
        activeSessions: { type: integer, format: int64 }
        runningChannels: { type: integer, format: int64 }
        enabledAutomations: { type: integer, format: int64 }

    Agent:
      x-go-type: agent.Agent
      x-go-type-import:
        path: github.com/recally-io/dex/internal/agent
      type: object
      required: [
        name,
        provider,
        modelId,
        thinkingLevel,
        fallbackProvider,
        fallbackModelId,
        instructions,
        environmentId,
      ]
      properties:
        id: { type: string, readOnly: true, description: The agent ID. }
        activity:
          allOf:
            - $ref: "#/components/schemas/AgentActivity"
          readOnly: true
          description: Activity counts returned by GET /api/agents.
        name: {
          type: string,
          minLength: 1,
          maxLength: 40,
          description: The bot name. Trim spaces before validation.,
        }
        provider: { type: string }
        modelId: { type: string, description: Empty when no model is chosen. }
        thinkingLevel: { $ref: "#/components/schemas/ThinkingLevel" }
        fallbackProvider: { type: string }
        fallbackModelId: {
          type: string,
          description: Empty when no fallback model is chosen. Needs a model.,
        }
        instructions: { type: string }
        environmentId: {
          type: string,
          description: Empty means the built-in local host environment.,
        }
        archivedAt:
          type: integer
          format: int64
          readOnly: true
          description: Archive time in Unix milliseconds. Absent for an active agent.

    AgentInput:
      x-go-type: agent.Agent
      x-go-type-import:
        path: github.com/recally-io/dex/internal/agent
      type: object
      required: [name, provider, modelId, thinkingLevel]
      properties:
        name: {
          type: string,
          minLength: 1,
          maxLength: 40,
          description: The bot name. Trim spaces before validation.,
        }
        provider: { type: string }
        modelId: { type: string, description: Empty when no model is chosen. }
        thinkingLevel: { $ref: "#/components/schemas/ThinkingLevel" }
        fallbackProvider: { type: string }
        fallbackModelId: {
          type: string,
          description: Empty when no fallback model is chosen. Needs a model.,
        }
        instructions: { type: string }
        environmentId: {
          type: string,
          description: Empty or "local" selects the built-in local host environment.,
        }

    CreateAgentInput:
      type: object
      required: [name]
      properties:
        name: {
          type: string,
          minLength: 1,
          maxLength: 40,
          description: The bot name. Trim spaces before validation.,
        }
        provider: { type: string }
        modelId: {
          type: string,
          description: Omitted copies the default bot's model. Empty chooses no model.,
        }
        thinkingLevel: { $ref: "#/components/schemas/ThinkingLevel" }
        fallbackProvider: { type: string }
        fallbackModelId: {
          type: string,
          description: Omitted copies the default bot's fallback model. Empty chooses none.,
        }
        instructions: { type: string }
        environmentId: {
          type: string,
          description: Omitted copies the default bot's execution environment. Empty or "local" selects the built-in local host environment.,
        }

    ThinkingLevel:
      type: string
      description: >
        pi-ai's ModelThinkingLevel. pi-ai sends the nearest level that the
        model supports.
      enum: [off, minimal, low, medium, high, xhigh, max]

    Provider:
      type: object
      required: [id, name, api, baseUrl, keySet, models]
      properties:
        id: { type: string }
        name: { type: string }
        api: { type: string, description: Empty for a built-in provider. }
        baseUrl: { type: string }
        keySet: { type: boolean }
        models:
          type: array
          description: The enabled model IDs; empty enables all models that the endpoint lists.
          items: { type: string }
        modelCount:
          type: integer
          description: The number of models in the catalog for this provider.
        error:
          type: string
          description: Why the engine could not list this provider's models.

    ProviderInput:
      type: object
      required: [api]
      properties:
        api: { type: string }
        name: { type: string }
        baseUrl: { type: string }
        apiKey:
          type: string
          description: Write-only. Empty keeps the saved key.
        models:
          type: array
          description: >
            The enabled model IDs. Empty enables all models that the endpoint
            lists.
          items: { type: string }

    ProviderModelsInput:
      type: object
      required: [api, baseUrl]
      properties:
        providerId:
          type: string
          description: A saved custom provider whose key to use when apiKey is empty.
        api: { type: string }
        baseUrl: { type: string }
        apiKey:
          type: string
          description: Write-only.

    ProviderModelList:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items: { $ref: "#/components/schemas/ProviderModel" }

    ProviderModel:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    ProviderInfo:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        source: { type: string }

    ModelList:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items: { $ref: "#/components/schemas/Model" }

    Model:
      type: object
      required: [provider, id, name, reasoning, input, thinkingLevels]
      properties:
        provider: { type: string }
        id: { type: string }
        name: { type: string }
        reasoning:
          type: boolean
          description: pi-ai's Model.reasoning. False means the model does not think.
        input:
          type: array
          description: pi-ai's Model.input.
          items: { type: string, enum: [text, image] }
        thinkingLevels:
          type: array
          description: pi-ai's getSupportedThinkingLevels(model).
          items: { $ref: "#/components/schemas/ThinkingLevel" }

    VaultEntry:
      type: object
      required: [name, scope, updatedAt]
      properties:
        name: { type: string }
        scope: { $ref: "#/components/schemas/ExtensionScope" }
        updatedAt: { type: string, format: date-time }

    Extensions:
      type: object
      required: [levels, skills, servers, warnings, errors, reloadPending]
      properties:
        levels:
          type: array
          description: >
            The .agents directories, from wide to narrow. Each can hold skills/.
            Two levels can have the same directory.
          items:
            type: object
            required: [scope, dir]
            properties:
              scope: { $ref: "#/components/schemas/ExtensionScope" }
              dir: { type: string }
        skills:
          type: array
          description: Current disk declarations; skills are read before each model request.
          items: { $ref: "#/components/schemas/Skill" }
        servers:
          type: array
          description: Loaded servers, or idle declarations before the agent opens.
          items: { $ref: "#/components/schemas/McpServer" }
        warnings:
          type: array
          items: { type: string }
        errors:
          type: array
          description: Invalid configuration prevents MCP startup and reload.
          items: { type: string }
        reloadPending:
          type: boolean
          description: >
            Extension files, vault entries, shell rc files, or 1Password settings changed after the agent
            loaded. dex reloads the agent when all agents are idle and the configuration is
            valid.

    ExtensionScope:
      type: string
      description: Shared across dex or scoped to one agent.
      enum: [dex, agent]

    Skill:
      type: object
      required: [name, description, scope, path, overrides]
      properties:
        name: { type: string }
        description: { type: string }
        scope:
          type: string
          description: >
            A file level, or project for .agents/skills under the agent workspace. The
            prompt reads the project level under the conversation's cwd.
          enum: [dex, agent, project]
        path: { type: string, description: The SKILL.md file. }
        overrides:
          type: boolean
          description: The skill replaces a wider skill with the same name.
        error:
          type: string
          description: Why the skill is not valid. The prompt does not list it.

    McpServer:
      type: object
      description: >
        An MCP server from control storage. Plain environment and header values
        are not returned. Vault references are returned as written.
      required: [name, scope, overrides, state, tools]
      properties:
        name: { type: string }
        scope: { $ref: "#/components/schemas/ExtensionScope" }
        overrides:
          type: boolean
          description: The server replaces a wider server with the same name.
        transport:
          type: string
          description: Absent for an agent entry that only turns off a global server.
          enum: [stdio, http]
        state:
          type: string
          description: idle means that the agent has not started, so dex has not connected.
          enum: [idle, connected, failed, disabled]
        tools:
          type: array
          description: The MCP tool names. The agent gets each tool as mcp__<server>__<tool>.
          items: { type: string }
        oauth:
          type: string
          description: The action or status of an OAuth connection. Absent for other connections.
          enum: [authorize, reauthorize, authorized]
        vaultReferences:
          type: object
          properties:
            env: { type: object, additionalProperties: { type: string } }
            headers: { type: object, additionalProperties: { type: string } }
        error: { type: string }

    Wechat:
      x-go-type: agent.Wechat
      x-go-type-import:
        path: github.com/recally-io/dex/internal/agent
      type: object
      required: [enabled, status]
      properties:
        enabled: { type: boolean }
        botId: { type: string }
        owner: { type: string }
        status: { $ref: "#/components/schemas/ChannelStatus" }

    WechatLogin:
      x-go-type: wechat.LoginView
      x-go-type-import:
        path: github.com/recally-io/dex/internal/channel/wechat
      type: object
      required: [id, status, qrContent, active]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [
            wait,
            scaned,
            need_verifycode,
            verify_code_blocked,
            scaned_but_redirect,
            expired,
            binded_redirect,
            confirmed,
          ]
        qrContent: { type: string }
        active: { type: boolean }
        reason: { type: string }

    TelegramManagedSetup:
      x-go-type: agent.TelegramManagedSetup
      x-go-type-import:
        path: github.com/recally-io/dex/internal/agent
      type: object
      required: [id, state, expiresAt]
      properties:
        id: { type: string }
        state: {
          type: string,
          enum: [
            verify_owner,
            create_bot,
            connected,
            expired,
            failed,
            canceled,
          ],
        }
        expiresAt: { type: integer, format: int64 }
        url: { type: string }
        username: { type: string }

    Telegram:
      type: object
      required: [enabled, allowedUsers, status]
      properties:
        enabled: { type: boolean }
        botId: { type: string }
        transport: { type: string, enum: [polling, webhook] }
        webhookUrl: { type: string }
        status: { $ref: "#/components/schemas/ChannelStatus" }
        allowedUsers:
          type: array
          items: { type: integer, format: int64 }
        options: { $ref: "#/components/schemas/TelegramOptions" }
        managerConfigured: { type: boolean }
        managedCreationAvailable: { type: boolean }

    ChannelStatus:
      x-go-type: channel.Status
      x-go-type-import:
        path: github.com/recally-io/dex/internal/channel
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [off, running, error, needs_login] }
        reason: { type: string }

    TelegramInput:
      type: object
      required: [token, allowedUsers]
      properties:
        token:
          type: string
          description: Write-only. Empty keeps the saved token.
        allowedUsers:
          type: array
          items: { type: integer, format: int64 }
        options:
          $ref: "#/components/schemas/TelegramOptions"
          description: Omission preserves saved options. Speech stays off until explicitly enabled with data-sending consent.
        transport:
          type: string
          enum: [polling, webhook]
          description: Omission keeps the transport for the same bot. New bots default to polling.
        webhook: { $ref: "#/components/schemas/TelegramWebhookInput" }

    TelegramWebhookInput:
      x-go-type: telegram.WebhookConfig
      x-go-type-import:
        path: github.com/recally-io/dex/internal/channel/telegram
      type: object
      required: [url, secretToken]
      properties:
        url:
          type: string
          format: uri
          description: Public HTTPS callback URL.
        secretToken:
          type: string
          writeOnly: true
          description: Random secret of 1 to 256 characters using A-Z, a-z, 0-9, hyphen, or underscore.

    TelegramOptions:
      x-go-type: telegram.Options
      x-go-type-import:
        path: github.com/recally-io/dex/internal/channel/telegram
      type: object
      properties:
        silent: { type: boolean, default: false }
        typing: { type: boolean }
        reactions:
          type: boolean
          description: Private chat status reactions. On when unset; false explicitly disables them.
        stt: { $ref: "#/components/schemas/TelegramSpeechOptions" }
        tts: { $ref: "#/components/schemas/TelegramSpeechOptions" }

    TelegramSpeechOptions:
      type: object
      properties:
        enabled: { type: boolean, default: false }
        allowSending:
          type: boolean
          default: false
          description: Explicit consent to send this bot's audio (STT) or text (TTS) to the selected provider. The provider can be an external third party. No automatic fallback provider is used.
        provider: { type: string }
        model: { type: string }
        voice: { type: string }
        language: { type: string }
        format: { type: string, enum: ["", opus, mp3, wav] }
        timeoutSeconds: {
          type: integer,
          minimum: 0,
          maximum: 120,
          description: Zero uses 30 seconds.,
        }
        maxBytes: {
          type: integer,
          format: int64,
          minimum: 0,
          maximum: 20971520,
          description: Zero uses 20 MiB for input and response bytes.,
        }
        maxDurationSeconds: {
          type: integer,
          minimum: 0,
          maximum: 3600,
          description: STT only. Checks Telegram reported audio duration. Zero uses 300 seconds. dex does not decode audio to measure duration.,
        }
        maxTextCharacters: {
          type: integer,
          minimum: 0,
          maximum: 10000,
          description: TTS only. Zero uses 4000 characters.,
        }

    Feishu:
      x-go-type: agent.Feishu
      x-go-type-import:
        path: github.com/recally-io/dex/internal/agent
      type: object
      required: [enabled, appId, brand, paired, status, error]
      properties:
        enabled: { type: boolean }
        appId: { type: string }
        brand: { type: string }
        paired: { type: boolean }
        transport: { type: string, enum: [websocket, webhook] }
        reactions:
          type: boolean
          description: Private chat status reactions. On when unset; false explicitly disables them.
        status: { type: string }
        error: { type: string }

    FeishuSetup:
      x-go-type: agent.FeishuSetup
      x-go-type-import:
        path: github.com/recally-io/dex/internal/agent
      type: object
      required: [session, qrUrl, interval, expiresIn, status, pairingCode]
      properties:
        session: { type: string }
        qrUrl: { type: string }
        interval: { type: integer }
        expiresIn: { type: integer }
        status: { type: string }
        pairingCode: { type: string }

    FeishuInput:
      type: object
      required: [appId, appSecret, brand]
      properties:
        appId: { type: string }
        appSecret:
          type: string
          description: Write-only. Empty keeps the secret for the same App ID and brand.
        brand: { type: string }
        reactions:
          type: boolean
          description: Omission preserves the saved preference. False disables private chat status reactions.
        transport:
          type: string
          enum: [websocket, webhook]
          description: Omission keeps the transport for the same app. New apps default to WebSocket.
        webhook: { $ref: "#/components/schemas/FeishuWebhookInput" }

    FeishuWebhookInput:
      x-go-type: feishu.WebhookConfig
      x-go-type-import:
        path: github.com/recally-io/dex/internal/channel/feishu
      type: object
      required: [verificationToken]
      properties:
        verificationToken:
          type: string
          writeOnly: true
          description: The Feishu or Lark verification token.
        encryptKey:
          type: string
          writeOnly: true
          description: Set this to require encrypted and signed events. Omit it for token verification only.

    FeishuBrand:
      type: object
      required: [brand]
      properties:
        brand: { type: string }

    FeishuPoll:
      type: object
      required: [session]
