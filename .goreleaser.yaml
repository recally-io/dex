# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - mise run build:web

builds:
  - id: dex
    main: ./cmd/dex
    binary: dex
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # dex reads its version from the VCS tag, not from -X.
    ldflags: [-s, -w]

  - id: dex-agent
    main: ./cmd/dex-agent
    binary: dex-agent
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s, -w]

archives:
  - ids: [dex]
    name_template: dex_{{ .Tag }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    files: [README.md]
  - id: dex-agent
    ids: [dex-agent]
    name_template: dex-agent_{{ .Tag }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    files:
      - src: docs/remote-machines.md
        dst: remote-machines.md
      - src: cmd/dex-agent/packaging/dex-agent.service
        dst: dex-agent.service
      - src: cmd/dex-agent/packaging/dex-agent-user.service
        dst: dex-agent-user.service
      - src: cmd/dex-agent/packaging/com.recally.dex-agent.plist
        dst: com.recally.dex-agent.plist

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

# The release workflow publishes the draft after the smoke tests pass.
release:
  draft: true
  prerelease: auto
