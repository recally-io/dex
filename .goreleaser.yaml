# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - mise run build:web

builds:
  - main: ./cmd/dex
    binary: dex
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # dex reads its version from the VCS tag, not from -X.
    ldflags: [-s, -w]

archives:
  - name_template: dex_{{ .Tag }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    files: [README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

# The release workflow publishes the draft after the smoke tests pass.
release:
  draft: true
  prerelease: auto
