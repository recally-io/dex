# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

# Run with --parallelism 1: each target writes its own worker to the same embedded file
# before its Go build.
builds:
  - main: ./cmd/dex
    binary: dex
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # dex reads its version from the VCS tag, not from -X.
    ldflags: [-s, -w]
    hooks:
      pre:
        # --force: the sources do not change between targets, so mise would skip the build and
        # embed the worker of the previous target.
        - cmd: mise run --force build:worker
          env:
            - GOOS={{ .Os }}
            - GOARCH={{ .Arch }}
          output: true

archives:
  - name_template: dex_{{ .Tag }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    files: [README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

# The release workflow publishes the draft after the smoke tests pass.
release:
  draft: true
  prerelease: auto
