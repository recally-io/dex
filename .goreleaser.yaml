# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - mise run build:web

builds:
  - id: dex
    main: ./cmd/dex
    binary: dex
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # dex reads its version from the VCS tag, not from -X.
    ldflags: [-s, -w]

  - id: dex-runner
    main: ./cmd/dex-runner
    binary: dex-runner
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s, -w]

archives:
  - ids: [dex]
    name_template: dex_{{ .Tag }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    files: [README.md]
  - id: dex-runner
    ids: [dex-runner]
    name_template: dex-runner_{{ .Tag }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    files:
      - src: docs/runner.md
        dst: runner.md
      - src: contrib/dex-runner.service
        dst: dex-runner.service

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

# The release workflow publishes the draft after the smoke tests pass.
release:
  draft: true
  prerelease: auto
