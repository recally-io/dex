version: "3"

tasks:
  build:
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      CGO_CFLAGS: "-mmacosx-version-min=12.0"
      CGO_LDFLAGS: "-mmacosx-version-min=12.0"
    cmds:
      - mise run build:web
      - mkdir -p bin
      - go build -trimpath -o bin/dex-wails3 .
  package:
    deps: [build]
    cmds:
      - rm -rf bin/Dex.app
      - mkdir -p bin/Dex.app/Contents/MacOS bin/Dex.app/Contents/Resources
      - cp bin/dex-wails3 bin/Dex.app/Contents/MacOS/Dex
      - cp build/macos/Info.plist bin/Dex.app/Contents/Info.plist
      - codesign --force --deep --sign - bin/Dex.app
  dev:
    cmds:
      - mise run build:web
      - go run .
