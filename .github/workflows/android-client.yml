name: Android client

on:
  pull_request:
    paths:
      - apps/native/**
      - apps/assets/**
      - .mise/tasks/android/**
      - .github/workflows/android-client.yml
      - .github/workflows/release.yml
  push:
    branches: [main]
    paths:
      - apps/native/**
      - apps/assets/**
      - .mise/tasks/android/**
      - .github/workflows/android-client.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.3.0
        with:
          install: false
      - run: mise run android:build
