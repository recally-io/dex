name: Apple client

on:
  pull_request:
    paths:
      - shared/assets/**
      - native/**
      - .mise/tasks/apple/**
      - .github/workflows/apple-client.yml
      - .github/workflows/release.yml
      - .mise/tasks/release/mac-app
  push:
    branches: [main]
    paths:
      - shared/assets/**
      - native/**
      - .mise/tasks/apple/**
      - .github/workflows/apple-client.yml
      - .github/workflows/release.yml
      - .mise/tasks/release/mac-app
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-client-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  apple:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.3.0
        with:
          install: false
      - run: mise run apple:test
      - run: mise run apple:build
      - run: mise run release:mac-app
