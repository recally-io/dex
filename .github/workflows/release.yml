name: Release

# Update VERSION on main (or push a v* tag) to release.
# A version with a hyphen, such as 0.17.0-rc.1, makes a prerelease.
on:
  push:
    branches: [main]
    paths: ["VERSION"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag to release (defaults to v<VERSION>)"
        required: false
        type: string

permissions:
  contents: read

# documd renders the diagrams of the docs; CI does not need it. mise refuses to install it,
# because the package has fewer weekly downloads than mise's supply-chain threshold.
env:
  MISE_DISABLE_TOOLS: npm:@markdown-viewer/documd

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            tag="${{ inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
          else
            ver="$(tr -d '[:space:]' < VERSION)"
            tag="v${ver#v}"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.ref_type }}" != "tag" ]] && git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    uses: ./.github/workflows/check.yml

  goreleaser:
    name: GoReleaser
    needs: [prepare, check]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      # Go reads the version from the tag; that needs the tags and a clean tree.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Ensure release tag exists
        run: |
          if ! git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi
      - uses: jdx/mise-action@v5.2.8
        with:
          install: true
          cache: true
      - run: mise run install
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          if [[ -f CHANGELOG.md ]]; then
            awk -v tag="$RELEASE_TAG" '
              $0 ~ "^## \\[" tag "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > /tmp/release-notes.md
          fi
          if [[ -s /tmp/release-notes.md ]]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi
      # The release is a draft until the smoke tests pass.
      - name: Run GoReleaser
        run: |
          if [[ "${{ steps.notes.outputs.has_notes }}" == "true" ]]; then
            goreleaser release --clean --release-notes=/tmp/release-notes.md
          else
            goreleaser release --clean
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

  smoke:
    name: Smoke ${{ matrix.target }}
    needs: [prepare, goreleaser]
    if: needs.prepare.outputs.should_release == 'true'
    # Each binary runs on its own platform.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: linux_amd64 }
          - { runner: ubuntu-24.04-arm, target: linux_arm64 }
          - { runner: macos-26, target: darwin_arm64 }
          - { runner: macos-26-intel, target: darwin_amd64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    # Only a token with write access can read a draft release.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Download
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "dex_${RELEASE_TAG}_${{ matrix.target }}.tar.gz" \
            --pattern "dex-agent_${RELEASE_TAG}_${{ matrix.target }}.tar.gz" --pattern checksums.txt
          grep " dex_${RELEASE_TAG}_${{ matrix.target }}.tar.gz$" checksums.txt | shasum -a 256 -c
          grep " dex-agent_${RELEASE_TAG}_${{ matrix.target }}.tar.gz$" checksums.txt | shasum -a 256 -c
          tar -xzf dex_*.tar.gz dex
          tar -xzf dex-agent_*.tar.gz dex-agent
      - name: Smoke test
        run: |
          test "$(./dex-agent version)" = "dex-agent $RELEASE_TAG"
          data="$(mktemp -d)"
          DEX_ADDR=127.0.0.1:18787 DEX_DATA_DIR="$data" ./dex &
          pid=$!
          trap 'kill "$pid"' EXIT
          for _ in $(seq 100); do
            health="$(curl -fsS http://127.0.0.1:18787/api/health 2>/dev/null)" && break
            sleep 0.2
          done
          echo "$health"
          test "$(jq -r .version <<<"$health")" = "$RELEASE_TAG"
          # The model list comes from the native agent runtime.
          curl -fsS http://127.0.0.1:18787/api/models | jq -e .models
          page="$(curl -fsS http://127.0.0.1:18787/)"
          grep -q '<div id="root">' <<<"$page"

  publish:
    name: Publish
    needs: [prepare, smoke]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
