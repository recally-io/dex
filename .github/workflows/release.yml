name: Release

# Push a tag such as v0.1.0 to release. A tag with a hyphen, such as v0.1.0-rc.1, makes a
# prerelease.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# documd renders the diagrams of the docs; CI does not need it. mise refuses to install it,
# because the package has fewer weekly downloads than mise's supply-chain threshold.
env:
  MISE_DISABLE_TOOLS: npm:@markdown-viewer/documd

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    uses: ./.github/workflows/check.yml

  goreleaser:
    name: GoReleaser
    needs: check
    # Go cross-compiles the native agent runtime and control.
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # Go reads the version from the tag; that needs the tags and a clean tree.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5.1.2
        with:
          install: true
          cache: true
      - run: mise run install
      # The release is a draft until the smoke tests pass.
      - run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

  smoke:
    name: Smoke ${{ matrix.target }}
    needs: goreleaser
    # Each binary runs on its own platform.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: linux_amd64 }
          - { runner: ubuntu-24.04-arm, target: linux_arm64 }
          - { runner: macos-26, target: darwin_arm64 }
          - { runner: macos-26-intel, target: darwin_amd64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    # Only a token with write access can read a draft release.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "dex_${GITHUB_REF_NAME}_${{ matrix.target }}.tar.gz" --pattern checksums.txt
          grep "_${{ matrix.target }}.tar.gz" checksums.txt | shasum -a 256 -c
          tar -xzf dex_*.tar.gz
      - name: Smoke test
        run: |
          data="$(mktemp -d)"
          DEX_ADDR=127.0.0.1:18787 DEX_DATA_DIR="$data" ./dex &
          pid=$!
          trap 'kill "$pid"' EXIT
          for _ in $(seq 100); do
            health="$(curl -fsS http://127.0.0.1:18787/api/health 2>/dev/null)" && break
            sleep 0.2
          done
          echo "$health"
          test "$(jq -r .version <<<"$health")" = "$GITHUB_REF_NAME"
          # The model list comes from the native agent runtime.
          curl -fsS http://127.0.0.1:18787/api/models | jq -e .models
          page="$(curl -fsS http://127.0.0.1:18787/)"
          grep -q '<div id="root">' <<<"$page"

  publish:
    name: Publish
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
