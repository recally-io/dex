name: Release

# Push a tag such as v0.1.0 to release. A tag with a hyphen, such as v0.1.0-rc.1, makes a
# prerelease.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# documd renders the diagrams of the docs; CI does not need it. mise refuses to install it,
# because the package has fewer weekly downloads than mise's supply-chain threshold.
env:
  MISE_DISABLE_TOOLS: npm:@markdown-viewer/documd

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: check
    # Each target builds on its own platform, so the smoke test can run the binary, and the macOS
    # worker gets its ad-hoc signature from codesign.
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-24.04, goos: linux, goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          - { runner: macos-26, goos: darwin, goarch: arm64 }
          - { runner: macos-26-intel, goos: darwin, goarch: amd64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      # Go reads the version from the tag; that needs the tags and a clean tree.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5.1.2
        with:
          install: true
          cache: true
      - run: mise run install:worker
      - run: mise run build:worker
      - run: go build -trimpath -o dist/dex ./cmd/dex
      - name: Smoke test
        run: |
          data="$(mktemp -d)"
          DEX_ADDR=127.0.0.1:18787 DEX_DATA_DIR="$data" ./dist/dex &
          pid=$!
          trap 'kill "$pid"' EXIT
          for _ in $(seq 100); do
            health="$(curl -fsS http://127.0.0.1:18787/api/health 2>/dev/null)" && break
            sleep 0.2
          done
          echo "$health"
          test "$(jq -r .version <<<"$health")" = "$GITHUB_REF_NAME"
          # The model list comes from the embedded worker, so it proves that the worker runs.
          curl -fsS http://127.0.0.1:18787/api/models | jq -e .models
          page="$(curl -fsS http://127.0.0.1:18787/)"
          grep -q '<div id="root">' <<<"$page"
      - name: Package
        run: |
          name="dex_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "pkg/$name"
          cp dist/dex README.md "pkg/$name/"
          tar -C pkg -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dex_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dex_*.tar.gz
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: (cd dist && sha256sum dex_*.tar.gz >checksums.txt)
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes "${flags[@]}"
