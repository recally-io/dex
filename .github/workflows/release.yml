name: Release

# Push a v* tag or run this workflow to release.
# A version with a hyphen, such as 0.17.0-rc.1, makes a prerelease.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag to release (defaults to v<VERSION>)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          else
            ver="$(tr -d '[:space:]' < VERSION)"
            tag="v${ver#v}"
          fi

          if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Expected a release tag such as v1.2.3 or v1.2.3-rc.1.' >&2
            exit 1
          fi
          bash .mise/tasks/release/notes "$tag" > /dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.ref_type }}" != "tag" ]] && git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    uses: ./.github/workflows/check.yml

  mac-app:
    name: Package Mac app
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.3.0
        with:
          install: false
      - run: mise run apple:test
      - run: mise run release:mac-app "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: mac-app
          path: .local/release/${{ needs.prepare.outputs.tag }}/Dex-${{ needs.prepare.outputs.tag }}-macOS-arm64.zip
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0

  android-app:
    name: Package Android app
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.3.0
        with:
          install: false
      - name: Build with the distribution key
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          KEYSTORE_B64: ${{ secrets.DEX_ANDROID_KEYSTORE_B64 }}
          NSGO_KEYSTORE_PASSWORD: ${{ secrets.DEX_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ vars.DEX_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          export DEX_ANDROID_KEYSTORE="$RUNNER_TEMP/dex.p12"
          trap 'rm -f "$DEX_ANDROID_KEYSTORE"' EXIT
          printf '%s' "${KEYSTORE_B64:?Missing release key}" | base64 --decode > "$DEX_ANDROID_KEYSTORE"
          unset KEYSTORE_B64
          mise run android:build "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: android-app
          path: .local/release/${{ needs.prepare.outputs.tag }}/Dex-${{ needs.prepare.outputs.tag }}-Android-arm64.apk
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0

  goreleaser:
    name: GoReleaser
    needs: [prepare, check, mac-app, android-app]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      # Go reads the version from the tag; that needs the tags and a clean tree.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Ensure release tag exists
        run: |
          if ! git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi
      - uses: jdx/mise-action@v5.3.0
        with:
          install: true
          cache: true
      - run: mise run install
      - name: Get the Mac app from this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name mac-app --dir ".local/release/$RELEASE_TAG"
      - name: Get the verified Android APK from this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name android-app --dir ".local/release/$RELEASE_TAG"
      - name: Extract release notes from CHANGELOG.md
        run: bash .mise/tasks/release/notes "$RELEASE_TAG" > /tmp/release-notes.md
      # The release is a draft until the smoke tests pass.
      - name: Run GoReleaser
        run: goreleaser release --clean --release-notes=/tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}

  smoke:
    name: Smoke ${{ matrix.target }}
    needs: [prepare, goreleaser]
    if: needs.prepare.outputs.should_release == 'true'
    # Smoke-test Linux (amd64/arm64) and macOS arm64 on their own platforms.
    # darwin_amd64 is still cross-built by GoReleaser on Ubuntu without waiting on an Intel macOS runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: linux_amd64 }
          - { runner: ubuntu-24.04-arm, target: linux_arm64 }
          - { runner: macos-26, target: darwin_arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    # Only a token with write access can read a draft release.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Download
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "dex_${RELEASE_TAG}_${{ matrix.target }}.tar.gz" \
            --pattern "dex-agent_${RELEASE_TAG}_${{ matrix.target }}.tar.gz" --pattern checksums.txt
          grep " dex_${RELEASE_TAG}_${{ matrix.target }}.tar.gz$" checksums.txt | shasum -a 256 -c
          grep " dex-agent_${RELEASE_TAG}_${{ matrix.target }}.tar.gz$" checksums.txt | shasum -a 256 -c
          tar -xzf dex_*.tar.gz dex
          tar -xzf dex-agent_*.tar.gz dex-agent
      - name: Verify the Android APK from the draft release
        if: matrix.target == 'linux_amd64'
        env:
          ANDROID_CERT_SHA256: ${{ vars.DEX_ANDROID_CERT_SHA256 }}
        run: |
          archive="Dex-${RELEASE_TAG}-Android-arm64.apk"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$archive"
          awk -v name="$archive" '$2 == name' checksums.txt | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$archive" | grep -Fx "Signer #1 certificate SHA-256 digest: ${ANDROID_CERT_SHA256:?}"
      - name: Verify the Mac app from the draft release
        if: matrix.target == 'darwin_arm64'
        run: |
          archive="Dex-${RELEASE_TAG}-macOS-arm64.zip"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$archive"
          awk -v name="$archive" '$2 == name' checksums.txt | shasum -a 256 -c
          ditto -x -k "$archive" .
          codesign --verify --deep --strict Dex.app
          lipo -verify_arch arm64 Dex.app/Contents/MacOS/Dex
          version=${RELEASE_TAG#v}
          test "$(plutil -extract CFBundleShortVersionString raw Dex.app/Contents/Info.plist)" = "${version%%-*}"
      - name: Smoke test
        run: |
          test "$(./dex-agent version)" = "dex-agent $RELEASE_TAG"
          data="$(mktemp -d)"
          DEX_ADDR=127.0.0.1:18787 DEX_DATA_DIR="$data" ./dex &
          pid=$!
          trap 'kill "$pid"' EXIT
          for _ in $(seq 100); do
            health="$(curl -fsS http://127.0.0.1:18787/api/health 2>/dev/null)" && break
            sleep 0.2
          done
          echo "$health"
          test "$(jq -r .version <<<"$health")" = "$RELEASE_TAG"
          # The model list comes from the native agent runtime.
          curl -fsS http://127.0.0.1:18787/api/models | jq -e .models
          page="$(curl -fsS http://127.0.0.1:18787/)"
          grep -q '<div id="root">' <<<"$page"

  publish:
    name: Publish
    needs: [prepare, smoke]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
