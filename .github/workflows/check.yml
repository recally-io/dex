name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the checks before it builds.
  workflow_call:

permissions:
  contents: read

# documd renders the diagrams of the docs; CI does not need it. mise refuses to install it,
# because the package has fewer weekly downloads than mise's supply-chain threshold.
env:
  MISE_DISABLE_TOOLS: npm:@markdown-viewer/documd

# A new push cancels a running PR check. A running main check finishes. The group does not use
# github.workflow, which is the caller's name in a called workflow: the same group as the caller
# would make the call wait for itself.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The jobs run the steps of `mise run check` in parallel. Keep them equal to the list in mise.toml.
jobs:
  lint:
    name: Lint and drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.3
        with:
          install: true
          cache: true
      - run: mise run install
      - run: prek validate-config prek.toml
      - run: dprint check
      - run: mise run check:testpolicy
      - run: mise run check:db-drift
      - run: mise run check:api-drift
      - run: git diff --check

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.3
        with:
          install: true
          cache: true
      - run: mise run install:web
      - run: mise run check:web

  go:
    name: Go lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.3
        with:
          install: true
          cache: true
      # Without the build cache every run compiles PiG and the other modules again. Only main saves
      # it, so pull requests cannot fill the repository cache with one entry per commit.
      - id: go-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-
      - run: go mod download
      # Go builds embed the web UI.
      - run: mise run install
      - run: mise run check:go
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # The four cross builds take minutes, so they run beside the tests instead of after them.
  native:
    name: Native builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.3
        with:
          install: true
          cache: true
      - id: go-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-native-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-native-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-native-${{ runner.os }}-
      - run: go mod download
      - run: mise run install
      - run: mise run check:native
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
