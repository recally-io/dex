name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the checks before it builds.
  workflow_call:

permissions:
  contents: read

# documd renders the diagrams of the docs; CI does not need it. mise refuses to install it,
# because the package has fewer weekly downloads than mise's supply-chain threshold.
env:
  MISE_DISABLE_TOOLS: npm:@markdown-viewer/documd

# A new push cancels a running PR check. A running main check finishes. The group does not use
# github.workflow, which is the caller's name in a called workflow: the same group as the caller
# would make the call wait for itself.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The jobs run every step of `mise run check`. App race tests run in three partitions;
# the Go job runs lint, builds, and all other packages. Keep coverage equal to mise.toml.
jobs:
  lint:
    name: Lint and drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.5
        with:
          install: true
          cache: true
      - run: mise run install
      - run: prek validate-config prek.toml
      - run: dprint check
      - run: mise run check:testpolicy
      - run: mise run check:db-drift
      - run: mise run check:api-drift
      - run: git diff --check

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.5
        with:
          install: true
          cache: true
      - run: mise run install:web
      - run: mise run check:web

  go:
    name: Go lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.5
        with:
          install: true
          cache: true
      # Without the build cache every run compiles PiG and the other modules again. Only main saves
      # it, so pull requests cannot fill the repository cache with one entry per commit.
      - id: go-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-
      # Go builds embed the web UI. install also downloads Go modules.
      - run: mise run install
      - run: mise run check:go without-app
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # App tests dominate the workflow. Every discovered test belongs to exactly one partition.
  app:
    name: App race tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.5
        with:
          install: true
          cache: true
      # Reuse the Go job's main-branch cache; do not save three duplicate archives.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-
      - run: mise run install
      - run: mise run check:app-shard ${{ strategy.job-index }} ${{ strategy.job-total }}
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: app-tests-${{ matrix.shard }}
          path: .local/ci/
          include-hidden-files: true
          retention-days: 7

  # Keep all four native targets beside the tests.
  native:
    name: Native builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.5
        with:
          install: true
          cache: true
      - id: go-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-native-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-native-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-native-${{ runner.os }}-
      - run: mise run install
      - run: mise run check:native
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
