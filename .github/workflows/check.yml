name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the checks before it builds.
  workflow_call:

permissions:
  contents: read

# A new push cancels a running PR check. A running main check finishes. The group does not use
# github.workflow, which is the caller's name in a called workflow: the same group as the caller
# would make the call wait for itself.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The jobs run every step of `mise run check`. App tests run in one job without the race detector,
# session race tests use separate partitions, and the Go job runs lint, builds, and all other packages. Keep coverage equal to mise.toml.
jobs:
  lint:
    name: Lint and drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.3.0
        with:
          install: true
          cache: true
      - run: mise run install
      - run: prek validate-config prek.toml
      - run: dprint check
      - run: mise run check:testpolicy
      - run: mise run check:db-drift
      - run: mise run check:api-drift
      - run: git diff --check

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.3.0
        with:
          install: true
          cache: true
      - run: mise run install:web
      - run: mise run check:web

  go:
    name: Go lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.3.0
        with:
          install: true
          cache: true
      # Without the build cache every run compiles PiG and the other modules again. Only main saves
      # it, so pull requests cannot fill the repository cache with one entry per commit.
      - id: go-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-
      # Go builds embed the web UI. install also downloads Go modules.
      - run: mise run install
      - run: mise run check:go without-integration
      # A restored cache keeps the entries of earlier runs, so it grows on each save. Go and
      # golangci-lint update the mtime of an entry they use when it is older than one hour. Delete
      # the entries this job did not use before the save.
      - if: github.ref == 'refs/heads/main'
        run: find ~/.cache/go-build ~/.cache/golangci-lint -type f -mmin +90 -delete
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # The race detector made app tests several times slower for little gain, so they run without it.
  app:
    name: App tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.3.0
        with:
          install: true
          cache: true
      # Reuse the Go job's main-branch cache; do not save duplicate archives. The paths must equal
      # the Go job's paths: actions/cache gives a different cache version for other paths.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-
      - run: mise run install
      - run: mise run check:go-shard ./internal/app ${{ strategy.job-index }} ${{ strategy.job-total }}
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: app-tests-${{ matrix.shard }}
          path: .local/ci/
          include-hidden-files: true
          retention-days: 7

  # A package-wide timeout must not cut off later session tests during native/SQLite-heavy runs.
  session:
    name: Session race tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.3.0
        with:
          install: true
          cache: true
      # The same paths as the Go job, as in the app job.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-
      - run: mise run install
      - run: mise run check:go-shard ./internal/session ${{ strategy.job-index }} ${{ strategy.job-total }}
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: session-tests-${{ matrix.shard }}
          path: .local/ci/
          include-hidden-files: true
          retention-days: 7

  # Keep all four native targets beside the tests.
  native:
    name: Native builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.3.0
        with:
          install: true
          cache: true
      - id: go-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-native-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-native-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-native-${{ runner.os }}-
      - run: mise run install
      - run: mise run check:native
      # Delete the build entries this job did not use, as in the Go job.
      - if: github.ref == 'refs/heads/main'
        run: find ~/.cache/go-build -type f -mmin +90 -delete
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
