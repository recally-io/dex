version: "3"
dev_mode:
  root_path: .
  ignore:
    dir: [".git", "node_modules", "bin"]
    file: [".DS_Store"]
    watched_extension: ["*.go"]
  executes:
    - cmd: npm run dev --prefix frontend
      type: background
    - cmd: wails3 task build
      type: blocking
    - cmd: wails3 task dev
      type: primary
